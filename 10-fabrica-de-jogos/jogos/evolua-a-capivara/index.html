<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Evolua a Capivara — Fábrica de Jogos INEMA</title>
<style>
  :root { --amarelo:#FACC15; --preto:#0c0c10; --texto:#f5f5f5 }
  html,body { margin:0; height:100%; background:var(--preto); color:var(--texto); overflow:hidden;
              touch-action:none; user-select:none; -webkit-user-select:none;
              font-family:Sora,system-ui,-apple-system,"Segoe UI",sans-serif }
  #c { display:block; position:fixed; inset:0; width:100vw; height:100vh }

  /* ---------- HUD (topo) ---------- */
  #hud { position:fixed; top:8px; left:8px; right:8px; max-width:720px; margin:0 auto; display:flex; flex-direction:column;
         gap:6px; pointer-events:none; z-index:2 }
  .linha1 { display:flex; gap:6px; align-items:stretch }
  .pilula { background:rgba(12,12,16,.84); border:2px solid #000; border-radius:14px; color:#fff; padding:6px 10px;
            box-shadow:0 3px 0 rgba(0,0,0,.35) }
  #h-moedas { flex:1.3; font-weight:800; font-size:clamp(19px,5vw,28px); display:flex; align-items:baseline; gap:6px;
              white-space:nowrap; overflow:hidden }
  #h-moedas b { color:var(--amarelo) }
  #h-moedas small { font-size:.52em; color:#86efac }
  .nivel { flex:1; font-weight:800; font-size:13px; display:flex; flex-direction:column; justify-content:center; gap:3px; min-width:0 }
  .nivel small { font-weight:700; color:#cbd5e1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .barra-xp, .barra-m { height:8px; background:#ffffff26; border-radius:6px; overflow:hidden }
  .barra-xp i, .barra-m i { display:block; height:100%; width:0; transition:width .25s }
  .barra-xp i { background:#22d3ee }
  .barra-m i { background:var(--amarelo) }
  #missao { display:grid; grid-template-columns:1fr auto; gap:3px 8px; font-weight:800; font-size:clamp(14px,3.8vw,18px) }
  #missao .barra-m { grid-column:1 / 3 }
  #m-prog { color:var(--amarelo) }
  #missao.ok { animation:missaoOk .7s }
  @keyframes missaoOk { 0% { transform:scale(1) } 30% { transform:scale(1.07); background:#FACC15; color:#0c0c10 } 100% { transform:scale(1) } }
  .pulo { animation:pulo .35s }
  @keyframes pulo { 50% { transform:scale(1.12) } }
  .btn-icone { pointer-events:auto; background:rgba(12,12,16,.84); color:#fff; border:2px solid #000; border-radius:14px;
               font-size:22px; min-width:50px; min-height:50px; cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,.35) }

  /* ---------- barra de baixo ---------- */
  #barra { position:fixed; left:0; right:0; bottom:24px; display:flex; justify-content:center; gap:10px; z-index:2; padding:0 10px }
  .btn { background:var(--amarelo); color:#1a1206; border:0; border-radius:14px; font-weight:800; font-family:inherit;
         padding:14px 20px; font-size:clamp(16px,4.4vw,21px); cursor:pointer; box-shadow:0 5px 0 #a16207 }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 #a16207 }
  .btn.sec { background:#1f2937; color:#fff; box-shadow:0 5px 0 #000 }
  .btn.apagado { filter:saturate(.35) brightness(.85) }
  #b-comprar { flex:0 1 340px; white-space:nowrap; padding:8px 14px; line-height:1.1 }
  #b-comprar small { display:block; font-size:.72em; opacity:.9 }
  /* contador de renascimentos (aparece depois do 1º renascer) */
  #h-ren { flex:0 0 auto; font-weight:800; font-size:13px; display:flex; flex-direction:column; justify-content:center;
           align-items:center; padding:4px 7px; line-height:1.25; color:#86efac }
  /* botão Renascer: aparece quando há uma Capivara Lendária */
  #b-renascer { position:fixed; left:50%; transform:translateX(-50%); bottom:96px; z-index:3; background:#4ade80;
                box-shadow:0 5px 0 #15803d; animation:chama 1.2s infinite; white-space:nowrap; padding:10px 18px }
  @keyframes chama { 50% { filter:brightness(1.15); transform:translateX(-50%) scale(1.05) } }
  .treme { animation:treme .35s }
  @keyframes treme { 25% { transform:translateX(-6px) } 75% { transform:translateX(6px) } }
  #rodape { position:fixed; bottom:4px; left:0; right:0; text-align:center; font-size:11px; color:#ffffffb0;
            pointer-events:none; z-index:2; text-shadow:0 1px 2px #000 }
  #aviso { position:fixed; left:50%; bottom:98px; transform:translateX(-50%); background:#000d; padding:9px 16px; border-radius:12px;
           font-weight:800; pointer-events:none; opacity:0; transition:opacity .3s; white-space:nowrap; z-index:3;
           font-size:clamp(13px,3.6vw,17px); border:2px solid var(--amarelo) }

  /* ---------- telas (início, criar) ---------- */
  #tela { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; background:rgba(12,12,16,.86); z-index:5 }
  #tela .caixa { max-width:560px; width:calc(100% - 32px); margin:auto; flex:0 1 auto; min-height:0; overflow:auto; text-align:center;
                 padding:16px; border:2px solid #333; border-radius:18px; background:#14141b; box-sizing:border-box }
  #tela.larga .caixa { max-width:940px }
  #tela .caixa.duas { display:grid; grid-template-columns:1fr; gap:6px 18px; align-items:center }
  @media (min-width:760px) { #tela .caixa.duas { grid-template-columns:1fr 230px } }
  @media (min-width:1000px) and (min-height:700px) { #tela .caixa.duas { grid-template-columns:1fr 270px } #tela .qr svg { width:240px; height:240px } }

  /* ---------- faixa INEMA.CLUB (tela inicial e tela de fim) ---------- */
  #faixa { flex:0 0 auto; width:100%; box-sizing:border-box; background:var(--amarelo); color:#1a1206; text-align:center;
           padding:12px 14px; border-bottom:4px solid var(--preto); font-family:Sora,"Segoe UI",Arial,sans-serif;
           font-weight:800; font-size:clamp(19px,5.2vw,34px); line-height:1.2; letter-spacing:-.01em }
  #faixa .nw { white-space:nowrap }
  #faixa b { display:inline-block; background:var(--preto); color:var(--amarelo); padding:1px 10px; border-radius:8px; margin-top:4px }

  /* ---------- QR code "Jogue no seu celular" ---------- */
  .qr { background:#fff; color:#0c0c10; border-radius:14px; padding:10px 10px 6px; display:inline-block; margin:6px auto 0;
        font-weight:800; font-size:16px; line-height:1.2 }
  .qr svg { width:180px; height:180px; display:block; margin:0 auto 4px }
  .lado { display:flex; flex-direction:column; align-items:center; gap:4px }

  /* ---------- botões pequenos, abas, tabelas ---------- */
  .btn.mini { padding:9px 13px; font-size:15px; box-shadow:0 4px 0 #000 }
  .abas { display:flex; gap:6px; justify-content:center; margin:8px 0 }
  .abas button { flex:1; max-width:220px; font:inherit; font-weight:800; font-size:15px; padding:9px; border-radius:12px; cursor:pointer;
                 border:2px solid #333; background:#1f2937; color:#fff }
  .abas button.on { background:var(--amarelo); color:#1a1206; border-color:var(--amarelo) }
  table.top { width:100%; border-collapse:collapse; font-size:16px; margin:4px 0 }
  table.top td { padding:6px 8px; border-bottom:1px solid #2a2a33; text-align:left }
  table.top td:first-child { width:2.2em; color:#a1a1aa; font-weight:800 }
  table.top td:last-child { text-align:right; font-weight:800; color:var(--amarelo) }
  table.top tr.novo td { background:var(--amarelo); color:#1a1206 }
  table.top tr.novo td:last-child { color:#1a1206 }
  .apelido { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:8px }
  .apelido input { font:inherit; font-size:18px; font-weight:800; padding:10px 12px; border-radius:12px; border:2px solid var(--amarelo);
                   background:#0b0b0f; color:#fff; width:10.5ch; text-align:center; user-select:text; -webkit-user-select:text; touch-action:auto }
  .erro { color:#fca5a5; font-weight:800; min-height:1.2em; margin:4px 0 0 }
  .placar { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:8px 0 }
  .placar div { background:#0b0b0f; border:2px solid #333; border-radius:12px; padding:8px 14px; font-weight:800 }
  .placar b { color:var(--amarelo); font-size:22px; display:block }

  /* ---------- loja e ajuda ---------- */
  .grade { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px; margin:8px 0 }
  .item { background:#0b0b0f; border:2px solid #333; border-radius:14px; padding:6px; display:flex; flex-direction:column; align-items:center; gap:3px }
  .item.equipada { border-color:#4ade80 }
  .item canvas { width:100%; height:92px }
  .item b { font-size:14px }
  .item small { font-size:12px; font-weight:800 }
  .item .btn { padding:7px 10px; font-size:14px; width:100%; box-shadow:0 3px 0 #a16207 }
  .evos { display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:6px; margin:6px 0 }
  .evos div { background:#0b0b0f; border-radius:12px; padding:4px; font-size:12px; font-weight:800 }
  .evos canvas { width:100%; height:70px; display:block }
  .ajuda p { text-align:left }
  #tela h1 { margin:.15em 0; font-size:clamp(28px,7vw,44px); color:var(--amarelo); line-height:1.1 }
  #tela p { line-height:1.45; color:#d4d4d8; margin:.6em 0 }
  #tela .linha { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px }
  #tela .link { background:none; border:0; color:#a1a1aa; text-decoration:underline; font:inherit; font-size:14px; cursor:pointer; margin-top:10px }
  #vitrine { width:100%; height:100px; display:block }
  .hidden { display:none !important }
  pre { text-align:left; background:#0b0b0f; padding:10px; border-radius:10px; overflow:auto; max-height:34vh; font-size:12px; white-space:pre-wrap }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="linha1">
    <div id="h-moedas" class="pilula">🪙 <b id="h-m">0</b> <small id="h-r">+0/s</small></div>
    <div class="pilula nivel"><span id="h-nv">Nível 1</span><div class="barra-xp"><i id="h-xp"></i></div><small id="h-cen">🌿 Lagoa</small></div>
    <div id="h-ren" class="pilula hidden" title="Renascimentos e sementes"><span id="h-ren1">♻️ 0</span><span id="h-ren2">🌱 0</span></div>
    <button id="b-ajuda" class="btn-icone" title="Ajuda">❓</button>
    <button id="b-menu" class="btn-icone" title="Menu">☰</button>
  </div>
  <div id="missao" class="pilula"><span id="m-txt">🎯 ...</span><span id="m-prog">0/0</span><div class="barra-m"><i id="m-bar"></i></div></div>
</div>

<div id="barra">
  <button id="b-som" class="btn-icone" title="Som">🔊</button>
  <button id="b-loja" class="btn-icone" title="Loja de skins">🛍️</button>
  <button id="b-comprar" class="btn">＋ Capivara<small>🪙 10</small></button>
  <button id="b-dica" class="btn-icone" title="Dica">💡</button>
</div>
<button id="b-renascer" class="btn hidden">🌱 Renascer</button>
<div id="aviso"></div>
<div id="rodape">Fábrica de Jogos INEMA · v0.2.0</div>
<div id="tela" class="hidden">
  <div id="faixa" class="hidden"><span class="nw">Aprenda a criar jogos com IA</span> — <span class="nw">de graça — <b>INEMA.CLUB</b></span></div>
  <div class="caixa" id="tela-conteudo"></div>
</div>

/* ===================== daqui para baixo é o motor ===================== */

const VERSAO = "0.2.0";
const FONTE_HTML = "<!doctype html>\n" + document.documentElement.outerHTML; // cópia do jogo para o botão "Baixar"
const $ = id => document.getElementById(id);
const QR_SVG = $("tpl-qr").innerHTML;           // o desenho do QR code (fica no <template> lá em cima)
const cv = $("c"), ctx = cv.getContext("2d");
const params = new URLSearchParams(location.search);
const DEMO = params.has("demo");            // ?demo=1 → o jogo joga sozinho (vitrine do estande)
const ACEL = DEMO ? CONFIG.demoAcelera : 1;
const ULTIMO = CONFIG.estagios.length - 1;  // índice do último estágio
const NVAGAS = 12;                          // 12 lugares no gramado (3×4 no celular, 4×3 no PC)
const CHAVE = "evolua-a-capivara-v2", CHAVE_ANTIGA = "evolua-a-capivara-v1", CHAVE_RECORDE = "evolua-a-capivara-recorde";
const CHAVE_META = "evolua-a-capivara-meta", CHAVE_TOP = "evolua-a-capivara-top10";

let dpr = 1;
function redimensiona() {
  dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
}
addEventListener("resize", redimensiona); redimensiona();

// ---------- utilidades ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function fmt(n) {                            // 1234 → "1.234"; 25300 → "25,3 mil"
  n = Math.floor(n);
  if (n < 10000) return n.toLocaleString("pt-BR");
  for (const [v, s] of [[1e9, "bi"], [1e6, "mi"], [1e3, "mil"]])
    if (n >= v) return (n / v).toLocaleString("pt-BR", { maximumFractionDigits: n / v < 100 ? 1 : 0 }) + " " + s;
}
function escurece(hex, f) {                  // deixa uma cor mais escura (f < 1)
  const n = parseInt(hex.slice(1), 16);
  return `rgb(${Math.round((n >> 16 & 255) * f)},${Math.round((n >> 8 & 255) * f)},${Math.round((n & 255) * f)})`;
}
let avisoT = 0;
function aviso(txt) { const a = $("aviso"); a.textContent = txt; a.style.opacity = 1; avisoT = 2.2; }
function anima(el, classe) { el.classList.remove(classe); void el.offsetWidth; el.classList.add(classe); }
function setTxt(id, txt) { const el = $(id); if (el.textContent !== txt) el.textContent = txt; }

// ---------- som (feito na hora, sem arquivos) ----------
let audio = null, somLigado = CONFIG.som;
function iniciaAudio() {                     // só pode criar o áudio depois de um toque/tecla
  if (audio || DEMO) return;
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
}
function som(tipo, tom = 1) {
  if (!audio || !somLigado) return;
  const notas = {
    pop:      [[520, 0, .08], [780, .06, .12]],
    moeda:    [[988, 0, .05], [1319, .05, .08]],
    compra:   [[440, 0, .06], [660, .06, .09]],
    erro:     [[180, 0, .16]],
    fanfarra: [[523, 0, .1], [659, .1, .1], [784, .2, .1], [1047, .3, .3]],
  }[tipo];
  const t0 = audio.currentTime;
  for (const [f, ini, dur] of notas) {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = tipo === "erro" ? "sawtooth" : "triangle"; o.frequency.value = f * tom;
    g.gain.setValueAtTime(0.0001, t0 + ini);
    g.gain.exponentialRampToValueAtTime(0.18, t0 + ini + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + ini + dur);
    o.connect(g).connect(audio.destination); o.start(t0 + ini); o.stop(t0 + ini + dur + 0.02);
  }
}
function alternaSom() { somLigado = !somLigado; $("b-som").textContent = somLigado ? "🔊" : "🔇"; }

// ---------- estado do jogo ----------
let E = null;               // tudo o que é salvo (moedas, nível, capivaras...)
let rodando = false;        // false = jogo pausado atrás de uma tela
let cenIdx = 0, transicao = null;
let celebra = null;         // tela "NOVA EVOLUÇÃO!" aberta
let arrasto = null;         // capivara sendo arrastada
let ocioso = 0, salvaT = 0, tremor = 0, demoReinicia = 0;
const particulas = [], textos = [], aneis = [], banners = [];

let fimPendente = false;    // chegou na Lendária: mostrar a tela de fim quando a festa acabar

// E = a PARTIDA atual (zera ao renascer). META = o que vale para sempre neste aparelho
// (sementes, renascimentos, skins compradas, skin em uso, último apelido).
// "Começar do zero" zera só a partida: as skins e as sementes continuam suas.
function metaNova() { return { sementes: 0, renascimentos: 0, skins: ["classica"], skin: "classica", apelido: "" }; }
let META = metaNova();
function carregaMeta() {
  if (DEMO) return metaNova();               // a vitrine sempre começa limpa e não grava nada
  try { return Object.assign(metaNova(), JSON.parse(localStorage.getItem(CHAVE_META) || "{}")); } catch (e) { return metaNova(); }
}
function salvaMeta() { if (DEMO) return; try { localStorage.setItem(CHAVE_META, JSON.stringify(META)); } catch (e) {} }
const multiplicador = () => 1 + META.renascimentos * CONFIG.bonusPorRenascer;   // bônus de renda de renascer
const rendaDe = e => CONFIG.estagios[e].moedasPorSegundo * multiplicador();       // renda de UMA capivara

function novaCapy(e) { return { e, anim: 0, cai: 0, fase: rnd(0, 6), tf: rnd(0.5, 2) }; }
function estadoNovo() {
  return { moedas: CONFIG.moedasIniciais, xp: 0, nivel: 1, compras: 0, maior: 0, fusoes: 0, toques: 0, ganho: 0,
           missaoIdx: 0, missao: null, presente: CONFIG.presenteACada, vagas: Array(NVAGAS).fill(null),
           total: 0,              // todas as moedas ganhas nesta partida (é a pontuação do Top 10)
           tempo: 0,              // segundos jogados nesta partida
           tempoLendaria: null,   // em quantos segundos chegou na Lendária (Top 10 de tempo)
           partida: Date.now().toString(36) + Math.floor(Math.random() * 1e4) };  // "RG" da partida no Top 10
}
function novoJogo() {
  E = estadoNovo();
  const ordem = [...Array(NVAGAS).keys()].sort(() => Math.random() - 0.5);
  for (let i = 0; i < CONFIG.capivarasIniciais; i++) poe(0, ordem[i]);
  cenIdx = cenarioDe(E.nivel); transicao = null; celebra = null; arrasto = null; fimPendente = false;
  iniciaMissao();
}
function salvar() {
  if (DEMO || !E) return;
  try { localStorage.setItem(CHAVE, JSON.stringify({ ...E, vagas: E.vagas.map(c => c ? c.e : -1) })); } catch (e) {}
}
function carrega() {
  try {
    let s = JSON.parse(localStorage.getItem(CHAVE) || "null");
    if (!s) {                                  // save da versão 0.1.0? traz o progresso para a 0.2.0
      s = JSON.parse(localStorage.getItem(CHAVE_ANTIGA) || "null");
      if (s) { s.total = s.ganho || 0;         // a 0.1.0 não tinha "total": usa o que ela tinha
               s.semTempo = true;               // nem relógio: essa partida fica fora do Top 10 de tempo
               if (s.maior >= ULTIMO) s.tempoLendaria = 0; }
    }
    if (!s || !Array.isArray(s.vagas)) return null;
    const est = Object.assign(estadoNovo(), s);
    est.vagas = Array.from({ length: NVAGAS }, (_, i) => s.vagas[i] >= 0 && s.vagas[i] <= ULTIMO ? novaCapy(s.vagas[i]) : null);
    return est;
  } catch (e) { return null; }
}
function recorde() { try { return +localStorage.getItem(CHAVE_RECORDE) || 0; } catch (e) { return 0; } }

const renda = () => E ? E.vagas.reduce((s, c) => s + (c ? rendaDe(c.e) : 0), 0) : 0;
const temLendaria = () => !!E && E.maior >= ULTIMO;
const precoAtual = () => Math.round(CONFIG.precoCapivara * Math.pow(CONFIG.aumentoPreco, E.compras));
const vagasLivres = () => E.vagas.map((c, i) => c ? -1 : i).filter(i => i >= 0);
const xpPara = n => CONFIG.xpPrimeiroNivel + CONFIG.xpAumentoPorNivel * (n - 1);
function cenarioDe(nivel) { let i = 0; CONFIG.cenarios.forEach((c, k) => { if (nivel >= c.nivel) i = k; }); return i; }

// ---------- lugares (vagas) na tela ----------
let vagaPos = [], tamVaga = 100;
function layout() {
  const topo = $("hud").getBoundingClientRect().bottom + 8;
  const base = $("barra").getBoundingClientRect().top - 10;
  const retrato = innerHeight > innerWidth;
  const cols = retrato ? 3 : 4, lins = retrato ? 4 : 3;
  const areaW = innerWidth - 20, areaH = Math.max(120, base - topo);
  tamVaga = Math.min(areaW / cols, areaH / lins, 175);
  const x0 = (innerWidth - tamVaga * cols) / 2, y0 = topo + (areaH - tamVaga * lins) / 2;
  vagaPos = [];
  for (let i = 0; i < NVAGAS; i++) vagaPos.push({ x: x0 + (i % cols + 0.5) * tamVaga, y: y0 + (Math.floor(i / cols) + 0.5) * tamVaga });
}
function vagaEm(x, y, f) {
  for (let i = 0; i < NVAGAS; i++) if (Math.abs(x - vagaPos[i].x) < tamVaga * f && Math.abs(y - vagaPos[i].y) < tamVaga * f) return i;
  return -1;
}
function achaPar() {           // procura duas capivaras iguais (as menos evoluídas primeiro)
  for (let e = 0; e < ULTIMO; e++) {
    const iguais = [];
    E.vagas.forEach((c, i) => { if (c && c.e === e && c.cai <= 0) iguais.push(i); });
    if (iguais.length >= 2) return iguais;
  }
  return null;
}

// ---------- efeitos ("juice") ----------
function explode(x, y, n, cores, forca = 260, tipo = "circ") {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), v = rnd(forca * 0.3, forca);
    particulas.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - forca * 0.3, vida: rnd(0.6, 1.1), v0: 1.1,
                      cor: cores[i % cores.length], tam: rnd(3, 7), tipo, giro: rnd(0, 6) });
  }
}
function flutua(x, y, txt, cor = "#FACC15", tam = 20, vida = 1.1) { textos.push({ x, y, txt, cor, tam, vida, v0: vida }); }
function banner(titulo, sub, cor = "#FACC15") { banners.push({ titulo, sub, cor, vida: 2.4, v0: 2.4 }); }

// ---------- ações do jogador ----------
function poe(e, i, caindo = false) {
  E.vagas[i] = novaCapy(e);
  if (caindo) E.vagas[i].cai = 1;
}
function comprar() {
  if (!E || !rodando) return;
  const p = precoAtual(), livres = vagasLivres();
  if (!livres.length) { aviso("Gramado cheio! Junte duas capivaras iguais."); som("erro"); anima($("b-comprar"), "treme"); return; }
  if (E.moedas < p) { aviso(`Faltam ${fmt(p - E.moedas)} moedas`); som("erro"); anima($("b-comprar"), "treme"); return; }
  E.moedas -= p; E.compras++;
  poe(0, livres[Math.floor(Math.random() * livres.length)], true);
  som("compra"); anima($("h-moedas"), "pulo");
}
function toca(i) {               // toque rápido numa capivara: moedas na hora
  const c = E.vagas[i]; if (!c) return;
  const ganho = Math.max(1, rendaDe(c.e) * CONFIG.bonusToque * ACEL);
  E.moedas += ganho; E.ganho += ganho; E.total += ganho; E.toques++;
  c.anim = 0.6;
  const p = vagaPos[i];
  flutua(p.x, p.y - tamVaga * 0.35, "+" + fmt(ganho), "#FACC15", 24);
  explode(p.x, p.y - tamVaga * 0.2, 6, ["#FACC15", "#fde68a"], 180, "moeda");
  som("moeda", 1 + c.e * 0.08);
}
function soltaEm(destino) {      // largou a capivara arrastada em cima de um lugar
  const de = arrasto.de, c = E.vagas[de]; arrasto = null;
  if (!c) return;
  if (destino < 0 || destino === de) { c.anim = 0.4; return; }
  const alvo = E.vagas[destino];
  if (!alvo) { E.vagas[destino] = c; E.vagas[de] = null; c.anim = 0.5; return; }
  if (alvo.e === c.e && c.e < ULTIMO && alvo.cai <= 0) { funde(de, destino); return; }
  if (alvo.e === c.e) aviso("Essa já é a evolução máxima! 👑");
  E.vagas[destino] = c; E.vagas[de] = alvo; c.anim = alvo.anim = 0.5;   // diferentes: trocam de lugar
}
function funde(de, para) {       // FUSÃO! duas iguais viram o próximo estágio
  const alvo = E.vagas[para]; E.vagas[de] = null;
  alvo.e++; alvo.anim = 1; E.fusoes++;
  const est = CONFIG.estagios[alvo.e], p = vagaPos[para];
  explode(p.x, p.y, 18 + alvo.e * 6, [est.cor, "#ffffff", "#FACC15", est.corpo], 300 + alvo.e * 30, "estrela");
  aneis.push({ x: p.x, y: p.y, r: tamVaga * 0.2, vida: 0.5, cor: est.cor });
  flutua(p.x, p.y - tamVaga * 0.5, est.nome + "!", "#ffffff", 18 + Math.min(alvo.e, 4) * 2, 1.4);
  tremor = Math.max(tremor, 0.25 + alvo.e * 0.08);
  som("pop", 1 + alvo.e * 0.15);
  ganhaXP(CONFIG.xpPorFusao * alvo.e);
  if (alvo.e > E.maior) {        // primeira vez neste estágio → tela NOVA EVOLUÇÃO!
    E.maior = alvo.e;
    celebra = { e: alvo.e, t: 0 };
    som("fanfarra");
    try { if (!DEMO && alvo.e > recorde()) localStorage.setItem(CHAVE_RECORDE, alvo.e); } catch (e) {}
    if (DEMO && alvo.e === ULTIMO) demoReinicia = 9;
    if (alvo.e === ULTIMO && E.tempoLendaria == null) { E.tempoLendaria = E.tempo; fimPendente = true; }  // chegou ao fim!
  }
}
function fundeAutomatico() {     // tecla F / botão 💡 quando não há dica: faz uma fusão
  const par = achaPar();
  if (!par) { aviso("Nenhum par igual. Compre mais capivaras!"); return; }
  arrasto = { de: par[0] }; soltaEm(par[1]);
}

// ---------- XP, nível e cenário ----------
function ganhaXP(n) {
  E.xp += n;
  while (E.xp >= xpPara(E.nivel)) {
    E.xp -= xpPara(E.nivel); E.nivel++;
    const premio = CONFIG.premioNivel * E.nivel;
    E.moedas += premio; E.total += premio;
    const novo = cenarioDe(E.nivel);
    if (novo !== cenIdx) {
      transicao = { de: cenIdx, t: 0 }; cenIdx = novo;
      banner("NÍVEL " + E.nivel + "!", "Novo cenário: " + CONFIG.cenarios[novo].nome + "  ·  +" + fmt(premio) + " moedas", "#22d3ee");
    } else banner("NÍVEL " + E.nivel + "!", "+" + fmt(premio) + " moedas de prêmio", "#22d3ee");
    explode(innerWidth / 2, innerHeight * 0.3, 40, ["#22d3ee", "#FACC15", "#f472b6", "#4ade80"], 420, "confete");
    som("fanfarra", 1.25);
  }
}

// ---------- missões ----------
function defMissao(i) {
  if (i < CONFIG.missoes.length) return { ...CONFIG.missoes[i] };
  const k = i - CONFIG.missoes.length, r = Math.max(10, renda());    // depois da lista: missões que se repetem
  return [
    { tipo: "fundir",  meta: 4 + (k % 4), texto: "Evolua {n} capivaras", xp: 40 },
    { tipo: "moedas",  meta: Math.ceil(r * 15 / 10) * 10, texto: "Ganhe {n} moedas", xp: 40 },
    { tipo: "comprar", meta: 3, texto: "Compre {n} capivaras", xp: 40 },
    { tipo: "tocar",   meta: 12, texto: "Toque {n} vezes nas capivaras", xp: 40 },
  ][k % 4];
}
function iniciaMissao() {
  for (let guarda = 0; guarda < 60; guarda++) {
    const def = defMissao(E.missaoIdx);
    if (def.tipo === "estagio" && E.maior >= def.meta) { E.missaoIdx++; continue; }  // já cumprida antes
    E.missao = { def, inicio: { fusoes: E.fusoes, compras: E.compras, toques: E.toques, ganho: E.ganho } };
    return;
  }
}
function progresso() {
  const { def, inicio } = E.missao;
  switch (def.tipo) {
    case "fundir":  return E.fusoes - inicio.fusoes;
    case "comprar": return E.compras - inicio.compras;
    case "tocar":   return E.toques - inicio.toques;
    case "moedas":  return E.ganho - inicio.ganho;
    case "estagio": return E.maior;
  }
  return 0;
}
function checaMissao() {
  if (!E.missao) iniciaMissao();
  const def = E.missao.def;
  if (progresso() < def.meta) return;
  const premio = Math.max(def.moedas || 0, Math.round(renda() * 6));
  E.moedas += premio; E.total += premio;
  const r = $("missao").getBoundingClientRect();
  explode(r.left + r.width / 2, r.top + r.height / 2, 30, ["#FACC15", "#ffffff", "#4ade80"], 320, "estrela");
  flutua(r.left + r.width / 2, r.bottom + 24, "MISSÃO CUMPRIDA! +" + fmt(premio), "#FACC15", 22, 1.6);
  anima($("missao"), "ok"); anima($("h-moedas"), "pulo");
  som("fanfarra", 1.5);
  E.missaoIdx++;
  ganhaXP(def.xp || 20);
  iniciaMissao();
}
function textoMissao() {
  const { def } = E.missao;
  const prog = def.tipo === "estagio" ? `${E.maior + 1}/${def.meta + 1}` : `${fmt(Math.min(progresso(), def.meta))}/${fmt(def.meta)}`;
  const frac = def.tipo === "estagio" ? E.maior / def.meta : progresso() / def.meta;
  return { txt: "🎯 " + def.texto.replace("{n}", fmt(def.meta)), prog, frac: clamp(frac, 0, 1) };
}

// ---------- entrada: toque, mouse e teclado ----------
cv.addEventListener("pointerdown", e => {
  iniciaAudio(); ocioso = 0;
  if (celebra) { if (celebra.t > 0.6) celebra = null; return; }
  if (!rodando || DEMO || !E) return;
  const i = vagaEm(e.clientX, e.clientY, 0.5);
  if (i < 0 || !E.vagas[i] || E.vagas[i].cai > 0) return;
  arrasto = { de: i, x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, id: e.pointerId, moveu: false };
});
addEventListener("pointermove", e => {
  if (!arrasto || e.pointerId !== arrasto.id) return;
  arrasto.x = e.clientX; arrasto.y = e.clientY;
  if (Math.hypot(arrasto.x - arrasto.x0, arrasto.y - arrasto.y0) > 10) arrasto.moveu = true;
});
addEventListener("pointerup", e => {
  if (!arrasto || e.pointerId !== arrasto.id) return;
  if (!arrasto.moveu) { const i = arrasto.de; arrasto = null; toca(i); return; }   // só tocou
  soltaEm(vagaEm(e.clientX, e.clientY, 0.62));
});
addEventListener("pointercancel", () => { if (arrasto && arrasto.id !== undefined) arrasto = null; });
addEventListener("keydown", e => {
  iniciaAudio(); ocioso = 0;
  const k = e.key.toLowerCase();
  if (celebra) { if (celebra.t > 0.6) celebra = null; return; }
  if (!rodando || DEMO) return;
  if (k === " " || k === "c" || k === "enter") { e.preventDefault(); comprar(); }
  else if (k === "f") fundeAutomatico();
  else if (k === "m") alternaSom();
  else if (k === "l") telaLoja();
  else if (k === "h" || k === "?") telaAjuda();
  else if (k === "escape") telaInicio();
});
$("b-comprar").onclick = () => { iniciaAudio(); comprar(); };
$("b-som").onclick = () => { iniciaAudio(); alternaSom(); };
$("b-dica").onclick = () => { iniciaAudio(); if (ocioso > 5) fundeAutomatico(); else ocioso = 99; };  // 1º toque mostra a dica, 2º faz a fusão
$("b-menu").onclick = () => telaInicio();
$("b-ajuda").onclick = () => { iniciaAudio(); telaAjuda(); };
$("b-loja").onclick = () => { iniciaAudio(); telaLoja(); };
$("b-renascer").onclick = () => { iniciaAudio(); telaRenascer(); };

// ---------- demonstração (?demo=1): o jogo joga sozinho ----------
const demo = { espera: 1.2, mov: null };
function passoDemo(dt) {
  if (celebra) { if (celebra.t > 2.2) celebra = null; return; }
  if (demoReinicia > 0 && (demoReinicia -= dt) <= 0) { novoJogo(); return; }
  if (demo.mov) {                          // a "mão" leva a capivara até a outra
    const m = demo.mov; m.t = Math.min(1, m.t + dt / 0.55);
    const ease = m.t < 0.5 ? 2 * m.t * m.t : 1 - Math.pow(-2 * m.t + 2, 2) / 2;
    const a = vagaPos[m.de], b = vagaPos[m.para];
    arrasto.x = a.x + (b.x - a.x) * ease; arrasto.y = a.y + (b.y - a.y) * ease;
    if (m.t >= 1) { demo.mov = null; soltaEm(m.para); demo.espera = 0.35; }
    return;
  }
  if ((demo.espera -= dt) > 0) return;
  demo.espera = 0.45;
  const par = achaPar();
  if (par) { arrasto = { de: par[0], x: vagaPos[par[0]].x, y: vagaPos[par[0]].y }; demo.mov = { de: par[0], para: par[1], t: 0 }; return; }
  if (vagasLivres().length && E.moedas >= precoAtual()) { comprar(); return; }
  const ocupadas = E.vagas.map((c, i) => c ? i : -1).filter(i => i >= 0);
  if (ocupadas.length) toca(ocupadas[Math.floor(Math.random() * ocupadas.length)]);
}

// ---------- ciclo principal ----------
function passo(dt) {
  layout();
  if (avisoT > 0 && (avisoT -= dt) <= 0) $("aviso").style.opacity = 0;
  for (let i = particulas.length - 1; i >= 0; i--) {
    const p = particulas[i]; p.vida -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 520 * dt; p.vx *= 0.98; p.giro += dt * 8;
    if (p.vida <= 0) particulas.splice(i, 1);
  }
  for (let i = textos.length - 1; i >= 0; i--) { const f = textos[i]; f.vida -= dt; f.y -= 45 * dt; if (f.vida <= 0) textos.splice(i, 1); }
  for (let i = aneis.length - 1; i >= 0; i--) { const a = aneis[i]; a.vida -= dt; a.r += 420 * dt; if (a.vida <= 0) aneis.splice(i, 1); }
  if (banners.length && !celebra && (banners[0].vida -= dt) <= 0) banners.shift();
  tremor = Math.max(0, tremor - dt * 1.6);
  if (transicao && (transicao.t += dt) >= 1) transicao = null;
  if (celebra) {
    celebra.t += dt;
    if (Math.random() < 0.6) particulas.push({ x: rnd(0, innerWidth), y: -10, vx: rnd(-40, 40), vy: rnd(60, 160), vida: 2.4, v0: 2.4,
      cor: ["#FACC15", "#f472b6", "#22d3ee", "#4ade80", "#ffffff"][Math.floor(rnd(0, 5))], tam: rnd(5, 9), tipo: "confete", giro: rnd(0, 6) });
  }
  // vitrine (?demo=1): a tela de fim fica uns segundos no telão e o jogo recomeça sozinho
  if (DEMO && !rodando && demoReinicia > 0 && (demoReinicia -= dt) <= 0) { fechaTela(); novoJogo(); rodando = true; }
  if (fimPendente && !celebra && rodando) { fimPendente = false; telaFim(); }
  if (!E || !rodando) return;

  // moedas entrando
  const g = renda() * dt * ACEL;
  E.moedas += g; E.ganho += g; E.total += g;
  if (!celebra) E.tempo += dt;           // relógio da partida (para o Top 10 de tempo)

  // capivaras: animações e "+moedas" flutuando
  E.vagas.forEach((c, i) => {
    if (!c) return;
    c.anim = Math.max(0, c.anim - dt * 1.6);
    if (c.cai > 0) {
      c.cai -= dt / 0.45;
      if (c.cai <= 0) { c.cai = 0; c.anim = 0.7; explode(vagaPos[i].x, vagaPos[i].y + tamVaga * 0.3, 8, ["#ffffffcc", "#e7d3b0"], 120); som("pop", 0.8); }
    }
    if ((c.tf -= dt) <= 0) {
      c.tf = 2;
      if (!arrasto || arrasto.de !== i)
        flutua(vagaPos[i].x + rnd(-10, 10), vagaPos[i].y - tamVaga * 0.4, "+" + fmt(rendaDe(c.e) * 2 * ACEL), "#fde047", 15, 0.9);
    }
  });

  // presente: um filhote de graça de tempos em tempos
  if ((E.presente -= dt * ACEL) <= 0) {
    E.presente = CONFIG.presenteACada;
    const livres = vagasLivres();
    if (livres.length) {
      const i = livres[Math.floor(Math.random() * livres.length)];
      poe(Math.min(CONFIG.presenteEstagioMax, Math.floor((E.nivel - 1) / 2), ULTIMO), i, true);
      flutua(vagaPos[i].x, vagaPos[i].y - tamVaga * 0.55, "Presente!", "#ffffff", 18, 1.3);
    }
  }

  if (DEMO) passoDemo(dt); else ocioso += dt;
  checaMissao();

  // HUD
  setTxt("h-m", fmt(E.moedas));
  setTxt("h-r", "+" + fmt(renda() * ACEL) + "/s");
  setTxt("h-nv", "Nível " + E.nivel);
  $("h-xp").style.width = (100 * E.xp / xpPara(E.nivel)).toFixed(1) + "%";
  const cen = CONFIG.cenarios[cenIdx];
  setTxt("h-cen", cen.emoji + " " + cen.nome);
  const m = textoMissao();
  setTxt("m-txt", m.txt); setTxt("m-prog", m.prog);
  $("m-bar").style.width = (m.frac * 100).toFixed(1) + "%";
  const p = precoAtual();
  if ($("b-comprar").dataset.p !== String(p)) { $("b-comprar").dataset.p = p; $("b-comprar").innerHTML = "＋ Capivara<small>🪙 " + fmt(p) + "</small>"; }
  $("b-renascer").classList.toggle("hidden", DEMO || !temLendaria());
  $("h-ren").classList.toggle("hidden", !META.renascimentos && !META.sementes);
  setTxt("h-ren1", "♻️ " + META.renascimentos); setTxt("h-ren2", "🌱 " + META.sementes);
  $("b-comprar").classList.toggle("apagado", E.moedas < p || !vagasLivres().length);

  if ((salvaT -= dt) <= 0) { salvaT = 2; salvar(); }
}

/* =====================================================================
   DESENHO — tudo é desenhado com formas simples no canvas
   ===================================================================== */
const circ = (g, x, y, r) => { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); };
const elipse = (g, x, y, rx, ry, rot = 0) => { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); };
const ret = (g, x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, r); };
const pinta = g => { g.fill(); g.stroke(); };
function estrela(g, x, y, r) {
  g.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * 0.35 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  g.closePath(); g.fill();
}

// A CAPIVARA: (g = onde desenhar, x/y = centro, tam = tamanho, e = estágio, t = tempo)
// o.skin = qual skin usar (se não disser, usa a skin equipada na loja)
function desenhaCapivara(g, x, y, tam, e, t, o = {}) {
  const est = CONFIG.estagios[e], ac = est.acessorio;
  const skin = tipoSkin(o.skin || META.skin);
  if (skin === "pixel" && !o.semPixel) return desenhaPixelada(g, x, y, tam, e, t, o);
  const chapeu = skin === "palha" || skin === "bone";          // chapéu/boné tira o enfeite da cabeça
  const k = tam / 125 * (e === 0 ? 0.8 : 1);
  const fase = o.fase || 0, respira = 1 + Math.sin(t * 3 + fase) * 0.03;
  g.save();
  g.translate(x, y + 40 * k);                       // apoia nos pés para "respirar"
  g.scale(k * (o.sx || 1), k * (o.sy || 1) * respira);
  g.translate(0, -40);
  g.lineJoin = "round"; g.lineCap = "round";
  const contorno = "#2a1a10", lw = 3.5;
  g.strokeStyle = contorno; g.lineWidth = lw;
  let corpo = est.corpo, barriga = est.barriga;
  if (skin === "dourada") { corpo = "#e0a526"; barriga = "#fde68a"; }
  if (skin === "arcoiris") {                        // a cor vai passando por todas as do arco-íris
    const hue = Math.round(t * 70 + (o.fase || 0) * 40) % 360;
    corpo = hsl2hex(hue, 75, 55); barriga = hsl2hex((hue + 40) % 360, 85, 80);
  }
  const escuro = escurece(corpo, 0.72);

  if (ac === "lendaria") {                          // brilho girando + capa vermelha
    g.save(); g.rotate(t * 0.8);
    for (let i = 0; i < 12; i++) {
      g.rotate(Math.PI / 6); g.fillStyle = i % 2 ? "rgba(253,224,71,.5)" : "rgba(251,146,60,.35)";
      g.beginPath(); g.moveTo(0, -10); g.lineTo(-13, -100); g.lineTo(13, -100); g.closePath(); g.fill();
    }
    g.restore();
    g.fillStyle = "#dc2626";
    g.beginPath(); g.moveTo(-30, -12); g.quadraticCurveTo(-60, 30, -44, 46); g.lineTo(44, 46); g.quadraticCurveTo(60, 30, 30, -12); g.closePath(); pinta(g);
  }
  // sombra
  g.fillStyle = "rgba(0,0,0,.22)"; elipse(g, 0, 46, 44, 8); g.fill();
  // pés
  g.fillStyle = escuro; ret(g, -32, 30, 18, 15, 7); pinta(g); ret(g, 14, 30, 18, 15, 7); pinta(g);
  // corpo (ou roupa)
  let roupa = ac === "cientista" ? "#f8fafc" : ac === "astronauta" ? "#eef2f7" : null;
  if (roupa && skin === "dourada") roupa = "#f5c542";
  g.fillStyle = roupa || corpo; elipse(g, 0, 14, 44, 31); pinta(g);
  if (!roupa) { g.fillStyle = barriga; elipse(g, 0, 22, 27, 18); g.fill(); }
  if (ac === "cientista") {                         // jaleco com gola em V e bolso com caneta
    g.fillStyle = barriga; g.beginPath(); g.moveTo(-14, -14); g.lineTo(0, 16); g.lineTo(14, -14); g.closePath(); pinta(g);
    g.fillStyle = contorno; circ(g, 0, 24, 2.2); g.fill(); circ(g, 0, 33, 2.2); g.fill();
    g.fillStyle = "#e2e8f0"; ret(g, -32, 14, 13, 11, 2); pinta(g);
    g.strokeStyle = "#2563eb"; g.beginPath(); g.moveTo(-27, 16); g.lineTo(-27, 7); g.stroke(); g.strokeStyle = contorno;
  }
  if (ac === "astronauta" || ac === "robo") {       // painel no peito com luzinhas
    g.fillStyle = ac === "robo" ? "#64748b" : "#334155"; ret(g, -15, 10, 30, 19, 5); pinta(g);
    ["#ef4444", "#facc15", "#22c55e"].forEach((c, i) => {
      g.fillStyle = Math.sin(t * 5 + i * 2) > 0 ? c : "#1e293b"; circ(g, -8 + i * 8, 19.5, 3.2); g.fill();
    });
  }
  if (ac === "robo") { g.fillStyle = "#e5e7eb"; [[-32, 10], [32, 10], [-22, 34], [22, 34]].forEach(([a, b]) => { circ(g, a, b, 2.6); g.fill(); }); }
  if (ac === "cientista") {                         // tubo de ensaio na mão
    g.save(); g.translate(24, -4); g.rotate(0.35);
    g.fillStyle = "#e0f2fe"; ret(g, -6, -24, 12, 28, 6); pinta(g);
    g.fillStyle = "#4ade80"; ret(g, -4.5, -8, 9, 10.5, 4.5); g.fill();
    g.fillStyle = "#ffffffaa"; circ(g, -1, -12 - (t * 12 % 10), 1.8); g.fill();
    g.restore();
  }
  // patinhas
  g.fillStyle = ac === "astronauta" ? "#e2e8f0" : escuro; g.lineWidth = 2;
  elipse(g, -21, 6, 7, 5.5, 0.4); pinta(g); elipse(g, 21, 6, 7, 5.5, -0.4); pinta(g); g.lineWidth = lw;
  // orelhas
  g.fillStyle = escuro; circ(g, -22, -57, 8); pinta(g); circ(g, 22, -57, 8); pinta(g);
  g.fillStyle = "#e8a0a0"; circ(g, -22, -57, 3.5); g.fill(); circ(g, 22, -57, 3.5); g.fill();
  // cabeça (capivara tem cabeça "quadradona")
  g.fillStyle = corpo; ret(g, -31, -64, 62, 54, 24); pinta(g);
  // focinho
  g.fillStyle = barriga; ret(g, -21, -38, 42, 27, 13); g.fill(); g.lineWidth = 2.5; g.stroke(); g.lineWidth = lw;
  g.fillStyle = "#3b2416"; elipse(g, -7, -29, 3.2, 2.4); g.fill(); elipse(g, 7, -29, 3.2, 2.4); g.fill();
  g.lineWidth = 2.5; g.beginPath(); g.moveTo(-6, -19); g.quadraticCurveTo(-3, -15, 0, -18); g.quadraticCurveTo(3, -15, 6, -19); g.stroke(); g.lineWidth = lw;
  // bochechas rosadas
  g.fillStyle = "rgba(255,120,140,.45)"; circ(g, -25, -32, 5.5); g.fill(); circ(g, 25, -32, 5.5); g.fill();
  // olhos (o robô tem visor de LED)
  if (ac === "robo") {
    g.fillStyle = "#0f172a"; ret(g, -24, -54, 48, 15, 7); pinta(g);
    g.fillStyle = `rgba(34,211,238,${0.7 + Math.sin(t * 4) * 0.3})`;
    ret(g, -18, -50.5, 11, 8, 3); g.fill(); ret(g, 7, -50.5, 11, 8, 3); g.fill();
  } else if ((t + fase * 3) % 4 < 0.13) {         // piscando
    g.beginPath(); g.moveTo(-18, -46); g.lineTo(-8, -46); g.moveTo(8, -46); g.lineTo(18, -46); g.stroke();
  } else {
    g.fillStyle = contorno; circ(g, -13, -46, 5.5); g.fill(); circ(g, 13, -46, 5.5); g.fill();
    g.fillStyle = "#fff"; circ(g, -11.3, -48, 1.9); g.fill(); circ(g, 14.7, -48, 1.9); g.fill();
  }
  // acessórios
  if (ac === "tangerina" && !chapeu) {
    g.fillStyle = "#fb923c"; circ(g, 4, -73, 11); pinta(g);
    g.fillStyle = "#22c55e"; elipse(g, 11, -85, 7, 3.5, -0.5); pinta(g);
  }
  if (ac === "flor" && !chapeu) {
    g.save(); g.translate(-21, -63); g.lineWidth = 2;
    for (let i = 0; i < 5; i++) { g.rotate(Math.PI * 2 / 5); g.fillStyle = "#f472b6"; elipse(g, 0, -6.5, 4.2, 6); pinta(g); }
    g.fillStyle = "#facc15"; circ(g, 0, 0, 3.6); pinta(g); g.restore();
  }
  if (ac === "cientista" && !chapeu) {              // cabelo maluco de cientista
    g.fillStyle = "#f1f5f9"; [[-14, -64], [-4, -69], [6, -68], [15, -63]].forEach(([a, b]) => { circ(g, a, b, 7); pinta(g); });
  }
  if ((ac === "oculos" || ac === "cientista") && skin !== "escuros") {
    g.fillStyle = "rgba(191,233,255,.35)"; circ(g, -13, -46, 10.5); pinta(g); circ(g, 13, -46, 10.5); pinta(g);
    g.beginPath(); g.moveTo(-2.5, -47); g.quadraticCurveTo(0, -50, 2.5, -47); g.stroke();
    g.beginPath(); g.moveTo(-23.5, -47); g.lineTo(-31, -50); g.moveTo(23.5, -47); g.lineTo(31, -50); g.stroke();
  }
  if (ac === "astronauta" && skin !== "dourada") {  // capacete de vidro
    g.fillStyle = "rgba(186,230,253,.25)"; circ(g, 0, -38, 47); g.fill();
    g.strokeStyle = "#e2e8f0"; g.lineWidth = 6; g.stroke();

    if (!W || !H) return;
    if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
    const g = c.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, c.clientWidth, c.clientHeight);
    desenhaCapivara(g, c.clientWidth / 2, c.clientHeight * 0.7, Math.min(c.clientWidth * 0.8, c.clientHeight * 0.78), +c.dataset.e, t, { fase: k, skin: c.dataset.skin });
  });
  const v = $("vitrine");
  if (!v) return;
  const W = v.clientWidth * dpr, H = v.clientHeight * dpr;
  if (v.width !== W || v.height !== H) { v.width = W; v.height = H; }
  const g = v.getContext("2d"), n = CONFIG.estagios.length, passo = v.clientWidth / n;
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, v.clientWidth, v.clientHeight);
  for (let i = 0; i < n; i++) {
    const pulo = Math.max(0, Math.sin(t * 4 - i * 0.6)) * 8;
    desenhaCapivara(g, passo * (i + 0.5), v.clientHeight * 0.55 - pulo, Math.min(passo * 1.1, 80), i, t, { fase: i });
  }
}

let ultimo = performance.now(), relogio = 0;
function laco(agora) {
  const dt = Math.min(0.05, (agora - ultimo) / 1000); ultimo = agora; relogio += dt;
  passo(dt); desenha(relogio);
  requestAnimationFrame(laco);
}

// ---------- telas ----------
// tela(html, {faixa, larga}): abre uma janela por cima do jogo.
//   faixa = mostra a faixa amarela do INEMA.CLUB no topo; larga = janela mais larga no PC
let principal = null;       // tela "mãe" (início ou fim) para onde o botão Voltar leva
function tela(html, o = {}) {
  $("tela-conteudo").innerHTML = html;
  $("tela-conteudo").classList.toggle("duas", !!o.duas);
  $("tela").classList.toggle("larga", !!o.duas);
  $("faixa").classList.toggle("hidden", !o.faixa);
  $("tela").classList.remove("hidden");
  $("tela-conteudo").scrollTop = 0;
}
function fechaTela() { $("tela").classList.add("hidden"); }
function voltar() { if (principal) principal(); else jogar(); }
function pausa() { rodando = false; arrasto = null; salvar(); }
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mmss = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");

// bloco do QR code + botão Baixar (tela inicial e tela de fim)
function blocoQR() {
  return `<div class="lado"><div class="qr">${QR_SVG}<div>📱 Jogue no seu celular</div></div>
    <button class="btn mini sec" onclick="baixar()">⬇ Baixar o jogo</button></div>`;
}
function botoesExtras() {
  return `<div class="linha"><button class="btn mini sec" onclick="telaTop()">🏆 Top 10</button>
    <button class="btn mini sec" onclick="telaLoja()">🛍️ Loja</button>
    <button class="btn mini sec" onclick="telaAjuda()">❓ Ajuda</button></div>`;
}
function linhaRenascer() {
  return META.renascimentos || META.sementes
    ? `<p style="font-size:14px">♻️ Renascimentos: <b>${META.renascimentos}</b> · 🌱 Sementes: <b>${META.sementes}</b> · renda <b>+${Math.round((multiplicador() - 1) * 100)}%</b></p>` : "";
}

function telaInicio() {
  pausa(); principal = telaInicio;
  const rec = recorde();
  tela(`<div>
    <h1>${CONFIG.titulo}</h1>
    <canvas id="vitrine"></canvas>
    <p>${CONFIG.comoJogar1}<br>${CONFIG.comoJogar2}</p>
    <div class="linha"><button class="btn" onclick="jogar()">▶ Jogar</button>
    <button class="btn sec" onclick="telaCriar()">🛠️ Criar a minha versão</button></div>
    ${botoesExtras()}
    ${temLendaria() && !DEMO ? `<div class="linha"><button class="btn" style="background:#4ade80;box-shadow:0 5px 0 #15803d" onclick="telaRenascer()">🌱 Renascer</button></div>` : ""}
    ${linhaRenascer()}
    ${rec > 0 ? `<p style="font-size:14px">⭐ Sua melhor evolução: <b>${CONFIG.estagios[rec].nome}</b></p>` : ""}
    ${E ? `<button class="link" onclick="jogarDoZero()">Começar do zero</button>` : ""}
    <p style="font-size:12px;color:#888;margin:6px 0 0">Fábrica de Jogos INEMA · v${VERSAO}</p></div>
    ${blocoQR()}`, { faixa: true, duas: true });
}
function jogar() { if (!E) novoJogo(); principal = null; rodando = true; fechaTela(); iniciaAudio(); }
function jogarDoZero() { novoJogo(); salvar(); jogar(); }

// TELA DE FIM: aparece quando a pessoa cria a CAPIVARA LENDÁRIA
function telaFim(msg) {
  pausa(); principal = telaFim;
  const tempo = E.tempoLendaria != null ? E.tempoLendaria : E.tempo;
  let meio;
  if (DEMO) {
    demoReinicia = 10;                                       // fica no telão e recomeça sozinho
    meio = `<p style="font-size:18px"><b>Agora é a sua vez!</b> Aponte a câmera do celular para o QR code e jogue.</p>`;
  } else {
    meio = (E.registrado ? `<p>✅ Salvo no Top 10 como <b>${esc(E.registrado)}</b></p>`
           : entraAlgum() ? formApelido() : `<p>Faltou pouco para o Top 10. Tente de novo!</p>`)
      + `<div class="linha"><button class="btn" style="background:#4ade80;box-shadow:0 5px 0 #15803d" onclick="telaRenascer()">🌱 Renascer</button>
         <button class="btn sec" onclick="jogar()">▶ Continuar</button></div>${botoesExtras()}`;
  }
  tela(`<div>
    <h1>🏆 CAPIVARA LENDÁRIA!</h1>
    <div class="placar"><div>⏱️ Tempo<b>${mmss(tempo)}</b></div><div>🪙 Moedas<b>${fmt(E.total)}</b></div></div>
    ${msg ? `<p class="erro">${msg}</p>` : ""}
    ${meio}</div>
    ${blocoQR()}`, { faixa: true, duas: true });
}

// ---------- TOP 10 (salvo só neste aparelho) ----------
// Dois placares: "pontos" (mais moedas numa partida) e "tempo" (menos tempo até a Lendária).
const hoje = () => new Date().toLocaleDateString("sv");    // "2026-10-27"
function carregaTop() {
  let t = { pontos: [], tempo: [] };
  try { t = Object.assign(t, JSON.parse(localStorage.getItem(CHAVE_TOP) || "{}")); } catch (e) {}
  if (CONFIG.placarDoDia) for (const k of ["pontos", "tempo"]) t[k] = t[k].filter(r => r.data === hoje());
  return t;
}
function salvaTop(t) { if (DEMO) return; try { localStorage.setItem(CHAVE_TOP, JSON.stringify(t)); } catch (e) {} }
const melhor = (aba, a, b) => aba === "tempo" ? a < b : a > b;   // no tempo, menor é melhor
function valorDe(aba) { return aba === "tempo" ? E.tempoLendaria : Math.floor(E.total); }
function entra(t, aba) {                     // esta partida entraria no placar "aba"?
  const v = valorDe(aba); if (v == null || (aba === "pontos" ? v <= 0 : E.semTempo)) return false;
  const lista = t[aba].filter(r => r.id !== E.partida), velho = t[aba].find(r => r.id === E.partida);
  if (velho && !melhor(aba, v, velho.valor)) return false;
  return lista.length < 10 || melhor(aba, v, lista[lista.length - 1].valor);
}
function entraAlgum() { if (DEMO || !E) return false; const t = carregaTop(); return entra(t, "pontos") || entra(t, "tempo"); }
// filtro simples de palavrão (tira acento e troca 4→a, 3→e, 1→i, 0→o, 5→s, @→a antes de comparar)
const PALAVROES = ["porra", "caralh", "merd", "bost", "puta", "puto", "foda", "fodi", "buceta", "bucet", "piroc", "cacete",
  "viado", "arromb", "vagabund", "desgrac", "corno", "xoxot", "xota", "penis", "pqp", "fdp", "vsf", "vtnc", "tnc", "krl",
  "cuzao", "otari", "imbecil", "retardad", "nazi", "hitler", "babaca", "punheta", "bunda", "rola", "pau", "cu", "boquete", "putz"];
const PALAVROES_INTEIROS = ["cu", "pau", "rola", "tnc", "krl", "vsf", "fdp", "pqp", "putz"];   // só se for a palavra inteira
function palavrao(txt) {
  const n = txt.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/4|@/g, "a").replace(/3/g, "e").replace(/1|!/g, "i").replace(/0/g, "o").replace(/5|\$/g, "s").replace(/7/g, "t");
  const palavras = n.split(/[^a-z]+/).filter(Boolean), junto = palavras.join("");
  // olha cada palavra; só junta tudo quando escreveram separado letra por letra ("p o r r a")
  const pedacos = palavras.every(p => p.length <= 2) ? [junto] : palavras;
  return PALAVROES.some(p => !PALAVROES_INTEIROS.includes(p) && pedacos.some(w => w.includes(p))) ||
         palavras.some(p => PALAVROES_INTEIROS.includes(p)) || PALAVROES_INTEIROS.includes(junto);
}
function formApelido() {
  return `<p style="margin-bottom:0"><b>Você entrou no Top 10!</b> Digite um apelido (até ${CONFIG.tamanhoApelido} letras, nada de nome completo):</p>
    <div class="apelido"><input id="apelido" maxlength="${CONFIG.tamanhoApelido}" value="${esc(META.apelido)}" placeholder="apelido"
      autocomplete="off" onkeydown="if(event.key==='Enter')registrar()">
    <button class="btn" onclick="registrar()">💾 Salvar</button></div><p class="erro" id="erro-apelido"></p>`;
}
function registrar() {
  if (DEMO || !E) return;
  const campo = $("apelido");
  const ap = (campo ? campo.value : "").replace(/[^\p{L}\p{N} _.-]/gu, "").trim().slice(0, CONFIG.tamanhoApelido);
  const erro = m => { if ($("erro-apelido")) $("erro-apelido").textContent = m; som("erro"); };
  if (ap.length < 2) return erro("Use pelo menos 2 letras.");
  if (palavrao(ap)) return erro("Ops! Escolha outro apelido, sem palavrão. 🙂");
  const t = carregaTop(); let aba = "pontos";
  for (const k of ["tempo", "pontos"]) {
    if (!entra(t, k)) continue;
    t[k] = t[k].filter(r => r.id !== E.partida);
    t[k].push({ id: E.partida, apelido: ap, valor: valorDe(k), data: hoje() });
    t[k].sort((a, b) => k === "tempo" ? a.valor - b.valor : b.valor - a.valor); t[k] = t[k].slice(0, 10);
    aba = k;
  }
  salvaTop(t);
  META.apelido = ap; E.registrado = ap; salvaMeta(); salvar();
  som("fanfarra");
  telaTop(aba, E.partida);
}
function telaTop(aba = "pontos", destaque = null) {
  pausa();
  const t = carregaTop(), lista = t[aba];
  const linhas = lista.length ? lista.map((r, i) =>
      `<tr class="${r.id === destaque ? "novo" : ""}"><td>${i + 1}º</td><td>${esc(r.apelido)}</td><td>${aba === "tempo" ? "⏱️ " + mmss(r.valor) : "🪙 " + fmt(r.valor)}</td></tr>`).join("")
    : `<tr><td></td><td>Ninguém ainda. Seja o primeiro!</td><td></td></tr>`;
  const pode = !DEMO && E && !E.registrado && entraAlgum();
  tela(`<h1>🏆 Top 10</h1>
    <div class="abas"><button class="${aba === "pontos" ? "on" : ""}" onclick="telaTop('pontos', '${destaque || ""}')">🪙 Pontuação</button>
    <button class="${aba === "tempo" ? "on" : ""}" onclick="telaTop('tempo', '${destaque || ""}')">⏱️ Tempo até a Lendária</button></div>
    <p style="font-size:13px;margin:2px 0">${aba === "tempo" ? "Quem criou a Capivara Lendária mais rápido" : "Mais moedas ganhas numa partida"}${CONFIG.placarDoDia ? " · placar de hoje" : ""}</p>
    <table class="top">${linhas}</table>
    ${pode ? formApelido() : ""}
    <div class="linha"><button class="btn sec" onclick="voltar()">Voltar</button></div>`);
}

// ---------- RENASCER ----------
function telaRenascer() {
  if (!temLendaria() || DEMO) return;
  pausa();
  const novoBonus = Math.round((META.renascimentos + 1) * CONFIG.bonusPorRenascer * 100);
  tela(`<h1>🌱 Renascer?</h1>
    <canvas id="vitrine"></canvas>
    <p>Seu gramado, suas moedas e seu nível <b>voltam ao zero</b>.</p>
    <p>Em troca você ganha <b>${CONFIG.sementesPorRenascer} sementes 🌱</b> (para skins raras na loja)
       e <b>+${Math.round(CONFIG.bonusPorRenascer * 100)}% de renda para sempre</b> (total: +${novoBonus}%).</p>
    ${E.registrado || !entraAlgum() ? "" : `<p style="color:#fde68a">Dica: antes, salve sua partida no 🏆 Top 10!</p>`}
    <div class="linha"><button class="btn" style="background:#4ade80;box-shadow:0 5px 0 #15803d" onclick="renascer()">🌱 Renascer agora</button>
    <button class="btn sec" onclick="voltar()">Ainda não</button></div>`);
}
function renascer() {
  if (!temLendaria() || DEMO) return;
  META.renascimentos++; META.sementes += CONFIG.sementesPorRenascer; salvaMeta();
  novoJogo(); salvar(); jogar();
  banner("RENASCEU! ♻️", "+" + CONFIG.sementesPorRenascer + " 🌱 · renda +" + Math.round((multiplicador() - 1) * 100) + "% para sempre", "#4ade80");
  explode(innerWidth / 2, innerHeight * 0.4, 60, ["#4ade80", "#FACC15", "#ffffff", "#86efac"], 460, "confete");
  som("fanfarra", 0.9);
}

// ---------- LOJA DE SKINS ----------
const CORES_RARIDADE = { "comum": "#a1a1aa", "rara": "#60a5fa", "épica": "#c084fc", "lendária": "#FACC15" };
function telaLoja(msg = "") {
  pausa();
  const moedas = E ? E.moedas : 0;
  const itens = CONFIG.skins.map(s => {
    const tem = META.skins.includes(s.id), usando = META.skin === s.id;
    const simbolo = s.moeda === "sementes" ? "🌱" : "🪙", saldo = s.moeda === "sementes" ? META.sementes : moedas;
    const botao = usando ? `<button class="btn sec" disabled>✔ Em uso</button>`
      : tem ? `<button class="btn" onclick="usarSkin('${s.id}')">Usar</button>`
      : `<button class="btn${saldo >= s.preco ? "" : " apagado"}" onclick="comprarSkin('${s.id}')">${simbolo} ${fmt(s.preco)}</button>`;
    return `<div class="item${usando ? " equipada" : ""}"><canvas data-e="1" data-skin="${s.id}"></canvas>
      <b>${s.nome}</b><small style="color:${CORES_RARIDADE[s.raridade] || "#fff"}">${s.raridade.toUpperCase()}</small>${botao}</div>`;
  }).join("");
  tela(`<h1>🛍️ Loja de skins</h1>
    <p style="margin:2px 0">Você tem <b>🪙 ${fmt(moedas)}</b> e <b>🌱 ${META.sementes}</b>. A skin vale para todas as capivaras.</p>
    <p class="erro" style="margin:0">${msg}</p>
    <div class="grade">${itens}</div>
    <p style="font-size:13px;margin:4px 0">🌱 Sementes vêm de <b>renascer</b> depois da Capivara Lendária.</p>
    <div class="linha" style="margin-top:6px"><button class="btn sec" onclick="voltar()">Voltar</button></div>`);
}
function comprarSkin(id) {
  const s = CONFIG.skins.find(s => s.id === id); if (!s || META.skins.includes(id)) return;
  if (s.moeda === "sementes") {
    if (META.sementes < s.preco) { som("erro"); return telaLoja(`Faltam ${s.preco - META.sementes} 🌱. Renasça para ganhar sementes!`); }
    META.sementes -= s.preco;
  } else {
    if (!E || E.moedas < s.preco) { som("erro"); return telaLoja(`Faltam ${fmt(s.preco - (E ? E.moedas : 0))} 🪙. Jogue mais um pouco!`); }
    E.moedas -= s.preco; salvar();
  }
  META.skins.push(id); META.skin = id; salvaMeta();
  som("fanfarra", 1.2); telaLoja();
}
function usarSkin(id) { if (!META.skins.includes(id)) return; META.skin = id; salvaMeta(); som("compra"); telaLoja(); }

// ---------- AJUDA ----------
function telaAjuda() {
  pausa();
  const evos = CONFIG.estagios.map((s, i) => `<div><canvas data-e="${i}" data-skin="classica"></canvas>${i + 1}. ${s.nome}</div>`).join("");
  tela(`<div class="ajuda"><h1>❓ Como jogar</h1>
    <p>👆 Arraste uma capivara sobre outra <b>igual</b>: as duas viram a próxima evolução.<br>
       🪙 Cada capivara dá moedas sozinha. Toque nela para ganhar moedas na hora.<br>
       🎯 Cumpra a missão do topo para ganhar prêmios e subir de nível.</p>
    <p style="text-align:center;margin-bottom:0"><b>As 7 evoluções</b></p>
    <div class="evos">${evos}</div>
    <p>🌱 <b>Renascer:</b> quando tiver a Capivara Lendária, você pode recomeçar do zero e ganhar
       ${CONFIG.sementesPorRenascer} sementes + ${Math.round(CONFIG.bonusPorRenascer * 100)}% de renda para sempre. Sementes compram skins raras na 🛍️ loja.</p>
    <p>⌨️ <b>Teclas:</b> <b>C</b>, Espaço ou Enter compra · <b>F</b> funde um par · <b>L</b> loja · <b>H</b> ajuda · <b>M</b> som · <b>Esc</b> menu</p>
    <div class="linha"><button class="btn" onclick="voltar()">Entendi!</button></div></div>`);
}

function telaCriar() {
  pausa();
  tela(`<h1>🛠️ Crie a sua versão</h1>
    <p><b>1.</b> Baixe este jogo (é um arquivo só).<br>
    <b>2.</b> Abra o arquivo num editor de texto e mude o <b>CONFIG</b> no topo: nomes dos estágios, cores, preços, missões, cenários, skins.<br>
    <b>3.</b> Quer mais? Cole o arquivo numa IA (ChatGPT, Gemini, Claude) e peça, por exemplo:</p>
    <pre>${CONFIG.promptExemplo}</pre>
    <div class="linha"><button class="btn" onclick="baixar()">⬇ Baixar o jogo</button>
    <button class="btn sec" onclick="voltar()">Voltar</button></div>
    <p style="font-size:13px">Aprenda a criar jogos com IA, de graça, no <b>INEMA.CLUB</b>.</p>`);
}
function baixar() {
  const blob = new Blob([FONTE_HTML], { type: "text/html" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "minha-evolua-a-capivara.html"; a.click();
}

// ---------- começo ----------
META = carregaMeta();
$("rodape").textContent = "Fábrica de Jogos INEMA · v" + VERSAO;
if (DEMO) { novoJogo(); rodando = true; }
else { E = carrega(); if (E) { cenIdx = cenarioDe(E.nivel); if (!E.missao) iniciaMissao(); } telaInicio(); }
requestAnimationFrame(laco);
</script>
