<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Roube o Ovo — Fábrica de Jogos INEMA</title>
<style>
  :root { --amarelo:#FACC15; --preto:#0c0c10; --texto:#f5f5f5; --painel:#16161ee6; --borda:#272730 }
  html,body { margin:0; height:100%; background:var(--preto); color:var(--texto); overflow:hidden;
              touch-action:none; user-select:none; -webkit-user-select:none; font-family:system-ui,-apple-system,"Segoe UI",sans-serif }
  canvas { display:block; width:100vw; height:100vh }

  /* HUD: painel da esquerda (moedas, nível, missão) e tempo/pets na direita */
  #hud { position:fixed; top:10px; left:10px; right:10px; display:flex; justify-content:space-between; align-items:flex-start; gap:8px;
         pointer-events:none; font-weight:800; text-shadow:0 2px 4px #000 }
  #painel { display:flex; flex-direction:column; gap:6px; width:min(300px, 62vw) }
  #hud-moedas { font-size:clamp(22px,3.4vw,32px); color:var(--amarelo); line-height:1 }
  #hud-dir { display:flex; flex-direction:column; align-items:flex-end; gap:4px; font-size:clamp(16px,2.4vw,22px) }
  .cartao { background:var(--painel); border:1px solid var(--borda); border-radius:12px; padding:7px 10px; text-shadow:none }
  .barra { height:9px; background:#00000088; border-radius:6px; overflow:hidden; margin-top:4px; border:1px solid #000 }
  .barra > div { height:100%; width:0; background:var(--amarelo); border-radius:6px; transition:width .25s }
  #nivel .linha1 { display:flex; justify-content:space-between; font-size:13px; gap:6px }
  #nv-txt { color:var(--amarelo) }
  #xp-txt { color:#a8a8b3; font-weight:700 }
  #missao .topo { display:flex; justify-content:space-between; font-size:11px; letter-spacing:.06em; color:#a8a8b3 }
  #m-txt { font-size:clamp(14px,2vw,17px); margin-top:2px; color:#fff }
  #m-barra { background:#22c55e !important }
  #m-premio { font-size:12px; color:#a8a8b3; margin-top:3px; font-weight:700 }
  #missao.festa { animation:pop .9s ease-out }
  @keyframes pop { 0%{transform:scale(1)} 25%{transform:scale(1.12); background:#FACC15; color:#1a1206} 100%{transform:scale(1)} }

  #botoes { position:fixed; right:14px; bottom:16px; display:flex; flex-direction:column; gap:10px }
  .btn { background:var(--amarelo); color:#1a1206; border:0; border-radius:12px; font-weight:800;
         padding:12px 16px; font-size:clamp(14px,2vw,17px); cursor:pointer; box-shadow:0 4px 0 #a16207 }
  .btn:disabled { background:#555; color:#bbb; box-shadow:none }
  .btn.sec { background:#1f2937; color:#fff; box-shadow:0 4px 0 #000 }
  #tela { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(12,12,16,.9); z-index:5 }
  #tela .caixa { max-width:560px; width:calc(100% - 32px); max-height:calc(100% - 24px); overflow:auto; text-align:center; padding:20px; border:1px solid #333; border-radius:16px; background:#14141b; box-sizing:border-box }
  #tela h1 { margin:.2em 0; font-size:clamp(28px,6vw,46px); color:var(--amarelo) }
  #tela p { line-height:1.45; color:#d4d4d8 }
  #tela .linha { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px }
  #tela table { margin:10px auto; border-collapse:collapse; font-size:17px }
  #tela td { padding:4px 12px; text-align:left }
  #tela .nv { display:inline-block; background:#1f2937; border-radius:10px; padding:8px 14px; font-weight:800; color:var(--amarelo) }
  #aviso { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#000c; padding:8px 14px; border-radius:10px;
           font-weight:700; pointer-events:none; opacity:0; transition:opacity .3s; max-width:calc(100% - 150px); text-align:center; font-size:clamp(13px,2vw,16px) }
  /* faixa grande de comemoração (missão e nível) */
  #festa { position:fixed; left:50%; top:38%; transform:translate(-50%,-50%); text-align:center; pointer-events:none; opacity:0; z-index:4; width:90% }
  #festa .g { font-size:clamp(34px,8vw,72px); font-weight:900; color:var(--amarelo); -webkit-text-stroke:2px #0c0c10; text-shadow:0 5px 0 #0c0c10 }
  #festa .p { font-size:clamp(15px,2.6vw,22px); font-weight:800; color:#fff; text-shadow:0 2px 4px #000; margin-top:6px }
  #festa.mostra { animation:festa 2.6s ease-out }
  @keyframes festa { 0%{opacity:0; transform:translate(-50%,-50%) scale(.4)} 12%{opacity:1; transform:translate(-50%,-50%) scale(1.1)}
                     20%{transform:translate(-50%,-50%) scale(1)} 80%{opacity:1} 100%{opacity:0; transform:translate(-50%,-60%) scale(1)} }
  .hidden { display:none !important }
  pre { text-align:left; background:#0b0b0f; padding:10px; border-radius:10px; overflow:auto; max-height:40vh; font-size:12px; white-space:pre-wrap }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="painel">
    <div id="hud-moedas">🪙 0</div>
    <div id="nivel" class="cartao">
      <div class="linha1"><span id="nv-txt">Nível 1 · Floresta</span><span id="xp-txt">0/40 XP</span></div>
      <div class="barra"><div id="xp-barra"></div></div>
    </div>
    <div id="missao" class="cartao hidden">
      <div class="topo"><span>🎯 MISSÃO</span><span id="m-prazo"></span></div>
      <div id="m-txt"></div>
      <div class="barra"><div id="m-barra"></div></div>
      <div id="m-premio"></div>
    </div>
  </div>
  <div id="hud-dir"><span id="hud-tempo">3:00</span><span id="hud-pets">🐣 0</span></div>
</div>
<div id="aviso"></div>
<div id="festa"><div class="g" id="festa-g"></div><div class="p" id="festa-p"></div></div>
<div id="botoes" class="hidden">
  <button class="btn" id="b-tranca">🔒 Trancar</button>
  <button class="btn sec" id="b-turbo">⚡ Turbo</button>
</div>
<div id="tela"><div class="caixa" id="tela-conteudo"></div></div>

<script>
/* =====================================================================
   ROUBE O OVO — Fábrica de Jogos INEMA (versão 0.2.0)
   ---------------------------------------------------------------------
   QUER CRIAR A SUA VERSÃO? Comece mudando os valores do CONFIG abaixo.
   Salve o arquivo e abra de novo no navegador para ver o efeito.
   Depois, peça para uma IA: "neste jogo, adicione um chefão que..."
   ===================================================================== */
const CONFIG = {
  titulo: "Roube o Ovo",
  duracaoRodada: 180,          // segundos de cada partida
  velocidadeJogador: 240,      // pixels por segundo
  velocidadeRobos: [165, 185, 205],
  pedestaisPorBase: 6,         // quantos ovos/pets cabem na base de cada robô (a sua cresce com o nível)
  tempoChocar: 5,              // segundos para o ovo virar pet
  intervaloOvos: 1.3,          // de quanto em quanto tempo nasce um ovo no ninho
  maxOvosNoNinho: 7,
  tempoTranca: 8,              // segundos com a base trancada
  recargaTranca: 25,           // segundos até poder trancar de novo
  turboCustoInicial: 25,       // moedas para o primeiro turbo
  turboGanho: 0.12,            // +12% de velocidade por turbo
  vendaBaseCheia: 5,           // base cheia? o ovo/pet que você traz é vendido por (moedas da raridade × isto)
  som: true,                   // false = jogo sem som
  raridades: [
    { nome: "Comum",    cor: "#9ca3af", chance: 60, moedas: 1 },
    { nome: "Raro",     cor: "#3b82f6", chance: 25, moedas: 3 },
    { nome: "Épico",    cor: "#a855f7", chance: 12, moedas: 8 },
    { nome: "Lendário", cor: "#FACC15", chance: 3,  moedas: 25 },
  ],
  nomesPets: ["Byte","Pixel","Turbo","Neura","Glitch","Volt","Quark","Bit","Chip","Nano","Prompt","Token","Cache","Loop","Robozito","Faísca"],
  robos: [
    { nome: "Robô Azul",  cor: "#3b82f6" },
    { nome: "Robô Rosa",  cor: "#ec4899" },
    { nome: "Robô Verde", cor: "#22c55e" },
  ],

  // ---------- NÍVEL 1 FÁCIL ----------
  // No primeiro minuto de quem está no nível 1, os robôs andam devagar e quase não mexem na sua base.
  facil: {
    segundos: 60,              // quanto tempo dura a moleza
    velocidadeRobos: 0.6,      // 0.6 = robôs a 60% da velocidade
    chanceMirarVoce: 0.1,      // 0.1 = só 10% das vezes um robô pensa em roubar de você
  },

  // ---------- MISSÕES ----------
  // Sempre tem 1 missão na tela. Cumpriu? Comemoração, moedas, XP e a próxima na hora.
  // tipo: "guardarOvo" (leve ovos para a sua base) · "chocar" (choque pets; rarMin 1 = raro ou melhor)
  //       "roubar" (roube da base de um robô; robo 0, 1, 2 ou -1 = qualquer um) · "derrubar" (esbarre em quem carrega)
  //       "trancar" (tranque a base com um robô chegando) · "moedas" (ganhe moedas com os seus pets)
  // n: quantas vezes (na de moedas é o mínimo: cresce se seus pets rendem muito) · desde: só aparece depois de X segundos de partida · {n} e {robo} viram número e nome no texto
  prazoMissao: 45,             // se demorar mais que isso, vem outra missão (sem castigo)
  missoes: [
    { tipo: "guardarOvo", n: 1, texto: "Leve 1 ovo do ninho para a sua base", moedas: 10, xp: 20 },
    { tipo: "chocar",     n: 1, texto: "Choque 1 pet",                       moedas: 10, xp: 20 },
    { tipo: "guardarOvo", n: 2, texto: "Pegue {n} ovos",                     moedas: 15, xp: 25 },
    { tipo: "moedas",     n: 15, texto: "Ganhe {n} moedas com os seus pets", moedas: 10, xp: 25 },
    { tipo: "chocar",     n: 1, rarMin: 1, texto: "Choque um pet raro (azul ou melhor)", moedas: 20, xp: 30 },
    { tipo: "roubar",     n: 1, robo: 0, texto: "Roube 1 ovo do {robo}",   moedas: 20, xp: 30 },
    { tipo: "trancar",    n: 1, desde: 50, texto: "Tranque a base a tempo: espere o robô chegar perto", moedas: 20, xp: 30 },
    { tipo: "derrubar",   n: 1, texto: "Esbarre num robô que carrega algo",   moedas: 20, xp: 30 },
    { tipo: "guardarOvo", n: 3, texto: "Pegue {n} ovos",                     moedas: 20, xp: 30 },
    { tipo: "roubar",     n: 2, robo: -1, texto: "Roube {n} vezes de qualquer robô", moedas: 25, xp: 35 },
  ],

  // ---------- NÍVEIS ----------
  // O nível e o XP ficam salvos entre partidas. A cada nível, algo muda na hora:
  // xp: XP total para chegar nesse nível · pedestais: lugares na SUA base · rendePets: multiplica as moedas dos seus pets
  // roboEsperto: 0 a 4 (1 = robôs trancam a base · 2 = caçam quem carrega · 3 e 4 = pensam mais rápido e correm mais)
  niveis: [
    { xp: 0,   cenario: "floresta", pedestais: 6,  rendePets: 1,    roboEsperto: 0 },
    { xp: 50,   cenario: "floresta", pedestais: 7,  rendePets: 1.25, roboEsperto: 0 },
    { xp: 130,  cenario: "deserto",  pedestais: 7,  rendePets: 1.5,  roboEsperto: 1 },
    { xp: 240,  cenario: "deserto",  pedestais: 8,  rendePets: 1.75, roboEsperto: 1 },
    { xp: 380,  cenario: "neve",     pedestais: 8,  rendePets: 2,    roboEsperto: 2 },
    { xp: 550,  cenario: "neve",     pedestais: 9,  rendePets: 2.5,  roboEsperto: 2 },
    { xp: 750,  cenario: "espaco",   pedestais: 10, rendePets: 3,    roboEsperto: 3 },
    { xp: 1000, cenario: "espaco",   pedestais: 10, rendePets: 3.5,  roboEsperto: 4 },
  ],
  xpPorNivelExtra: 300,        // depois do último nível da lista, cada nível novo custa mais isso de XP

  // ---------- CENÁRIOS ----------
  // enfeite: "arvore", "cacto", "pinheiro" ou "planeta"
  cenarios: {
    floresta: { nome: "Floresta", chao: "#173225", grade: "#1d3d2d", ninho: "#5b4636", borda: "#8b6b4f", enfeite: "arvore" },
    deserto:  { nome: "Deserto",  chao: "#b58a4a", grade: "#c29756", ninho: "#7a4e25", borda: "#e0b878", enfeite: "cacto" },
    neve:     { nome: "Neve",     chao: "#7f9fb8", grade: "#8fb0c8", ninho: "#5a6f86", borda: "#e6f0f8", enfeite: "pinheiro" },
    espaco:   { nome: "Espaço",   chao: "#141033", grade: "#1f1a4a", ninho: "#3b2f6b", borda: "#8b7fd6", enfeite: "planeta" },
  },
};
/* ===================== daqui para baixo é o motor ===================== */

const VERSAO = "0.2.0";
const W = 1600, H = 1000;
const FONTE_HTML = "<!doctype html>\n" + document.documentElement.outerHTML;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const DEMO = params.has("demo");          // ?demo=1 → o jogo joga sozinho (vitrine do estande)
const CODIGO_OVO = (params.get("ovo") || "").toUpperCase();
const CHAVE_PROGRESSO = "roube-ovo-progresso";

let escala = 1, ox = 0, oy = 0, retrato = false;
function redimensiona() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  // celular em pé: o mapa fica maior e a câmera segue você (mostra uma parte do mapa por vez)
  retrato = cv.height > cv.width * 1.2;
  escala = retrato ? Math.min(cv.height * 0.6 / H, cv.width / (W * 0.45)) : Math.min(cv.width / W, cv.height / H);
  ox = (cv.width - W * escala) / 2; oy = retrato ? cv.height * 0.24 : (cv.height - H * escala) / 2;
}
function camera() {
  if (!retrato) return;
  const alvoX = jogador ? jogador.x : W / 2;
  const desejado = clamp(cv.width / 2 - alvoX * escala, cv.width - W * escala, 0);
  ox += (desejado - ox) * 0.12;
}
addEventListener("resize", redimensiona); redimensiona();

// ---------- utilidades ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function sorteiaRaridade() {
  const total = CONFIG.raridades.reduce((s, r) => s + r.chance, 0);
  let x = Math.random() * total;
  for (let i = 0; i < CONFIG.raridades.length; i++) { x -= CONFIG.raridades[i].chance; if (x <= 0) return i; }
  return 0;
}
const novoPetNome = () => CONFIG.nomesPets[Math.floor(Math.random() * CONFIG.nomesPets.length)];
let avisoTimer = 0;
function aviso(txt) { const a = $("aviso"); a.textContent = txt; a.style.opacity = 1; avisoTimer = 2.4; }
function festa(grande, pequeno) {
  $("festa-g").textContent = grande; $("festa-p").textContent = pequeno || "";
  const f = $("festa"); f.classList.remove("mostra"); void f.offsetWidth; f.classList.add("mostra");
}

// ---------- som (bipes simples, feitos na hora) ----------
let audio = null;
function som(notas) {
  if (!CONFIG.som) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state !== "running") return;           // o navegador só libera som depois de um toque
    notas.forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain(), t0 = audio.currentTime + i * 0.09;
      o.type = "square"; o.frequency.value = f; g.gain.setValueAtTime(0.06, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
      o.connect(g); g.connect(audio.destination); o.start(t0); o.stop(t0 + 0.17);
    });
  } catch (e) {}
}
addEventListener("pointerdown", () => { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {} });

// ---------- nível e XP (salvos no navegador) ----------
let progresso = { xp: 0 };
if (!DEMO) try { const p = JSON.parse(localStorage.getItem(CHAVE_PROGRESSO)); if (p && p.xp >= 0) progresso.xp = +p.xp; } catch (e) {}
function salvaProgresso() { if (!DEMO) try { localStorage.setItem(CHAVE_PROGRESSO, JSON.stringify(progresso)); } catch (e) {} }

// devolve a configuração do nível n (1, 2, 3...). Depois do último da lista, repete o último com mais XP e pets rendendo mais.
function nivelCfg(n) {
  const L = CONFIG.niveis;
  if (n <= L.length) return L[n - 1];
  const ult = L[L.length - 1], extra = n - L.length;
  return { ...ult, xp: ult.xp + extra * CONFIG.xpPorNivelExtra, rendePets: +(ult.rendePets + extra * 0.25).toFixed(2) };
}
function nivelDoXp(xp) { let n = 1; while (xp >= nivelCfg(n + 1).xp) n++; return n; }
let nivel = nivelDoXp(progresso.xp);
const cenarioAtual = () => CONFIG.cenarios[nivelCfg(nivel).cenario] || Object.values(CONFIG.cenarios)[0];

// ---------- mundo ----------
const NINHO = { x: W / 2, y: H / 2, r: 120 };
let bases, agentes, soltos, jogador, tempo, rodando, timerOvo, turbos;
let missao = null, idxMissao = 0, missoesCumpridas = 0, moedasGanhas = 0, xpPartida = 0, partidaFacil = false;
let particulas = [], textos = [], timerTextosPets = 0, moedasMostradas = 0;
const decorrido = () => CONFIG.duracaoRodada - tempo;

// arruma os pedestais da base em 2 fileiras; guarda o que já estava em cima deles
function montaPedestais(b, n) {
  const cols = Math.ceil(n / 2), antigos = b.pedestais || [];
  b.w = Math.max(300, cols * 62 + 20);
  b.pedestais = [];
  for (let i = 0; i < n; i++) {
    const c = i % cols, l = Math.floor(i / cols);
    b.pedestais.push({ x: b.x - b.w / 2 + (c + 0.5) * (b.w / cols), y: b.y - 30 + l * 60, item: antigos[i] ? antigos[i].item : null });
  }
}
function criaBase(x, y, nome, cor, dono, n) {
  const b = { x, y, w: 300, h: 150, nome, cor, dono, moedas: 0, trancadaAte: 0, recargaAte: 0, pedestais: [] };
  montaPedestais(b, n);
  return b;
}
const dentroDaBase = (p, b) => Math.abs(p.x - b.x) < b.w / 2 && Math.abs(p.y - b.y) < b.h / 2;

function novaPartida() {
  if (DEMO) { progresso.xp = 0; nivel = 1; }        // a vitrine sempre começa do nível 1
  bases = [
    criaBase(W / 2, H - 95, "Você", "#FACC15", "jogador", nivelCfg(nivel).pedestais),
    criaBase(190, H / 2, CONFIG.robos[0].nome, CONFIG.robos[0].cor, "robo", CONFIG.pedestaisPorBase),
    criaBase(W - 190, H / 2, CONFIG.robos[1].nome, CONFIG.robos[1].cor, "robo", CONFIG.pedestaisPorBase),
    criaBase(W / 2, 95, CONFIG.robos[2].nome, CONFIG.robos[2].cor, "robo", CONFIG.pedestaisPorBase),
  ];
  jogador = { x: W / 2, y: H - 240, vel: CONFIG.velocidadeJogador, carregando: null, base: bases[0], atordoado: 0, cor: "#FACC15", nome: "Você", ehJogador: true };
  agentes = [jogador];
  for (let i = 0; i < 3; i++) {
    const b = bases[i + 1];
    agentes.push({ x: b.x, y: b.y, vel: CONFIG.velocidadeRobos[i], carregando: null, base: b, atordoado: 0,
                   cor: b.cor, nome: b.nome, alvo: null, pensa: 0, idx: i });
  }
  soltos = []; tempo = CONFIG.duracaoRodada; timerOvo = 0; turbos = 0;
  particulas = []; textos = []; moedasMostradas = 0;
  missoesCumpridas = 0; moedasGanhas = 0; xpPartida = 0; idxMissao = 0;
  partidaFacil = nivel === 1;                        // nível 1: primeiro minuto bem fácil
  if (DEMO) jogador.alvo = null, jogador.pensa = 0;
  // ovo da feira: ?ovo=L-XXXX começa com um pet dessa raridade na sua base
  const letra = CODIGO_OVO[0], idx = { C: 0, R: 1, E: 2, L: 3 }[letra];
  if (idx !== undefined) {
    bases[0].pedestais[0].item = { tipo: "pet", rar: idx, nome: novoPetNome(), t: 0 };
    aviso(`O seu ovo da feira chocou: pet ${CONFIG.raridades[idx].nome.toUpperCase()}!`);
  }
  rodando = true;
  $("botoes").classList.toggle("hidden", DEMO);
  $("tela").classList.add("hidden");
  $("missao").classList.remove("hidden");
  proximaMissao(true);
}

// ---------- missões ----------
// quantas vezes a missão pede. A de moedas cresce junto com os seus pets (para não acabar num piscar de olhos).
function alvoMissao(m) {
  if (m.tipo !== "moedas" || !missao || missao.def !== m) return m.n;
  return missao.alvo || m.n;
}
function textoMissao(m) {
  const robo = m.robo >= 0 ? CONFIG.robos[m.robo].nome : "robô";
  return m.texto.replace("{n}", alvoMissao(m)).replace("{robo}", robo);
}
function rendaPorSegundo() {
  const rende = nivelCfg(nivel).rendePets;
  return bases[0].pedestais.reduce((s, p) => s + (p.item?.tipo === "pet" ? CONFIG.raridades[p.item.rar].moedas * rende : 0), 0);
}
function proximaMissao(primeira) {
  const L = CONFIG.missoes;
  for (let tentativa = 0; tentativa < L.length; tentativa++) {
    const m = L[idxMissao % L.length]; idxMissao++;
    // base cheia? pula as missões de levar ovo e chocar (não teria como cumprir)
    const cheia = bases[0].pedestais.every(p => p.item) && (m.tipo === "guardarOvo" || m.tipo === "chocar");
    if ((m.desde || 0) <= decorrido() && !cheia) { missao = { def: m, prog: 0, inicio: decorrido(), moedasInicio: moedasGanhas };

    ctx.fillStyle = "#6b4226"; ctx.fillRect(-6, 0, 12, 26); ctx.strokeRect(-6, 0, 12, 26);
    ctx.fillStyle = "#2f8f46"; ctx.beginPath(); ctx.arc(0, -10, 26, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#3fb35a"; ctx.beginPath(); ctx.arc(-8, -18, 10, 0, 7); ctx.fill();
  } else if (tipo === "cacto") {
    ctx.fillStyle = "#3f9b4a";
    ctx.beginPath(); ctx.roundRect(-9, -40, 18, 62, 9); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(-26, -22, 12, 26, 6); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(14, -30, 12, 24, 6); ctx.fill(); ctx.stroke();
  } else if (tipo === "pinheiro") {
    ctx.fillStyle = "#5b3a22"; ctx.fillRect(-5, 10, 10, 16); ctx.strokeRect(-5, 10, 10, 16);
    for (const [yy, ww] of [[12, 28], [-6, 22], [-22, 15]]) {
      ctx.fillStyle = "#1f6b45"; ctx.beginPath(); ctx.moveTo(-ww, yy); ctx.lineTo(0, yy - 26); ctx.lineTo(ww, yy); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#f1f5f9"; ctx.beginPath(); ctx.moveTo(-ww * 0.35, yy - 17); ctx.lineTo(0, yy - 26); ctx.lineTo(ww * 0.35, yy - 17); ctx.closePath(); ctx.fill();
    }
  } else if (tipo === "planeta") {
    ctx.fillStyle = "#f97316"; ctx.beginPath(); ctx.arc(0, 0, 18, 0, 7); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = "#fde68a"; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(0, 0, 32, 8, -0.4, 0, 7); ctx.stroke();
  }
  ctx.restore();
}

function desenha(t) {
  const cen = cenarioAtual();
  camera();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#0c0c10"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(escala, 0, 0, escala, ox, oy);
  // chão
  ctx.fillStyle = cen.chao; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = cen.grade; ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 80) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 80) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  // detalhes do cenário: estrelas no espaço, neve caindo na neve
  if (cen.enfeite === "planeta") for (let i = 0; i < 70; i++) {
    ctx.fillStyle = `rgba(255,255,255,${0.35 + 0.35 * Math.sin(t * 2 + i)})`; ctx.fillRect((i * 337) % W, (i * 191) % H, 3, 3);
  }
  for (const e of ENFEITES) desenhaEnfeite(cen.enfeite, e.x, e.y, e.s, t);
  if (cen.enfeite === "pinheiro") { ctx.fillStyle = "#ffffffcc";
    for (let i = 0; i < 60; i++) { ctx.beginPath(); ctx.arc((i * 137 + t * 25) % W, (i * 251 + t * 50) % H, 2.5, 0, 7); ctx.fill(); } }
  // ninho
  ctx.fillStyle = cen.ninho; ctx.beginPath(); ctx.arc(NINHO.x, NINHO.y, NINHO.r, 0, 7); ctx.fill();
  ctx.strokeStyle = cen.borda; ctx.lineWidth = 6; ctx.setLineDash([14, 10]); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = "#ffffff88"; ctx.font = "700 22px system-ui"; ctx.textAlign = "center"; ctx.fillText("NINHO", NINHO.x, NINHO.y - NINHO.r - 10);
  if (!bases) return;
  const agora = decorrido();
  // bases
  for (const b of bases) {
    ctx.fillStyle = b.cor + "33"; ctx.strokeStyle = b.cor; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.roundRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h, 18); ctx.fill(); ctx.stroke();
    for (const p of b.pedestais) {
      ctx.fillStyle = "#00000055"; ctx.beginPath(); ctx.ellipse(p.x, p.y + 14, 22, 8, 0, 0, 7); ctx.fill();
      if (p.item) {
        desenhaItem(p.item, p.x, p.y, 1, t);
        if (p.item.tipo === "ovo") { // barra de chocar
          const f = clamp(p.item.t / CONFIG.tempoChocar, 0, 1);
          ctx.fillStyle = "#000a"; ctx.fillRect(p.x - 18, p.y + 22, 36, 5);
          ctx.fillStyle = "#FACC15"; ctx.fillRect(p.x - 18, p.y + 22, 36 * f, 5);
        }
      }
    }
    ctx.font = "800 20px system-ui"; ctx.textAlign = "center"; ctx.lineWidth = 5; ctx.strokeStyle = "#0c0c10"; ctx.lineJoin = "round";
    const ry = b.y < H / 2 && b.x === W / 2 ? b.y + b.h / 2 + 24 : b.y - b.h / 2 - 12;
    const rot = `${b.nome} · 🪙 ${Math.floor(b.moedas)}`;
    ctx.strokeText(rot, b.x, ry); ctx.fillStyle = "#fff"; ctx.fillText(rot, b.x, ry);
    if (b.trancadaAte > agora) {
      ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 3; ctx.globalAlpha = 0.6 + Math.sin(t * 10) * 0.3;
      for (let x = b.x - b.w / 2 + 10; x < b.x + b.w / 2; x += 22) { ctx.beginPath(); ctx.moveTo(x, b.y - b.h / 2); ctx.lineTo(x, b.y + b.h / 2); ctx.stroke(); }
      ctx.globalAlpha = 1;
    }
  }
  // itens soltos
  for (const s of soltos) desenhaItem(s.item, s.x, s.y, 1, t);
  // agentes
  for (const a of agentes) {
    ctx.save(); ctx.translate(a.x, a.y);
    if (a.atordoado > 0) ctx.rotate(Math.sin(t * 30) * 0.3);
    ctx.fillStyle = "#00000066"; ctx.beginPath(); ctx.ellipse(0, 20, 18, 6, 0, 0, 7); ctx.fill();
    ctx.fillStyle = a.cor; ctx.strokeStyle = "#0c0c10"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 20, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(-7, -4, 5, 0, 7); ctx.arc(7, -4, 5, 0, 7); ctx.fill();
    ctx.fillStyle = "#0c0c10"; ctx.beginPath(); ctx.arc(-6, -3, 2.5, 0, 7); ctx.arc(8, -3, 2.5, 0, 7); ctx.fill();
    if (a.ehJogador) { ctx.font = "800 15px system-ui"; ctx.textAlign = "center"; ctx.lineWidth = 4; ctx.strokeText("VOCÊ", 0, -30); ctx.fillStyle = "#fff"; ctx.fillText("VOCÊ", 0, -30); }
    ctx.restore();
    if (a.carregando) desenhaItem(a.carregando, a.x, a.y - (a.ehJogador ? 52 : 36), 0.9, t);
  }
  // partículas da comemoração
  for (const p of particulas) {
    ctx.globalAlpha = clamp(1 - p.t / p.vida, 0, 1); ctx.fillStyle = p.cor;
    ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // números que sobem (+moedas, +XP)
  ctx.textAlign = "center"; ctx.lineJoin = "round";
  for (const s of textos) {
    ctx.globalAlpha = clamp(1.4 - s.t, 0, 1);
    ctx.font = `900 ${s.tam}px system-ui`; ctx.lineWidth = 6; ctx.strokeStyle = "#0c0c10";
    ctx.strokeText(s.txt, s.x, s.y); ctx.fillStyle = s.cor; ctx.fillText(s.txt, s.x, s.y);
  }
  ctx.globalAlpha = 1;
  // joystick
  if (joy.ativo && !DEMO) {
    ctx.setTransform(1, 0, 0, 1, 0, 0); const d = devicePixelRatio || 1;
    ctx.strokeStyle = "#ffffff66"; ctx.lineWidth = 3 * d;
    ctx.beginPath(); ctx.arc(joy.x0 * d, joy.y0 * d, 50 * d, 0, 7); ctx.stroke();
    const m = Math.min(1, 50 / (Math.hypot(joy.dx, joy.dy) || 1));
    ctx.fillStyle = "#FACC1599"; ctx.beginPath(); ctx.arc((joy.x0 + joy.dx * m) * d, (joy.y0 + joy.dy * m) * d, 22 * d, 0, 7); ctx.fill();
  }
}

function laco(agora) {
  const dt = Math.min(0.05, (agora - ultimo) / 1000); ultimo = agora;
  passo(dt); desenha(agora / 1000);
  requestAnimationFrame(laco);
}

// ---------- telas ----------
function tela(html) { $("tela-conteudo").innerHTML = html; $("tela").classList.remove("hidden"); }
function telaInicio() {
  const de = nivelCfg(nivel).xp, ate = nivelCfg(nivel + 1).xp;
  tela(`<h1>🥚 ${CONFIG.titulo}</h1>
    <p>Pegue ovos no <b>ninho</b> e leve para a <b>sua base</b> (embaixo). Eles chocam em pets que dão moedas.
    Cumpra <b>missões rápidas</b>, suba de <b>nível</b> e roube dos robôs!</p>
    <p><b>Mover:</b> setas/WASD ou arraste o dedo · <b>Trancar base:</b> espaço · <b>Turbo:</b> T<br>
    Esbarre em quem está carregando para fazer derrubar.</p>
    <span class="nv">⭐ Nível ${nivel} · ${cenarioAtual().nome} · ${progresso.xp - de}/${ate - de} XP</span>
    <div class="linha"><button class="btn" onclick="novaPartida()">▶ Jogar</button>
    <button class="btn sec" onclick="telaCriar()">🛠️ Criar a minha versão</button></div>
    <p style="font-size:12px;color:#888;margin-top:14px">Fábrica de Jogos INEMA · v${VERSAO} · inspirado em jogos de "roubar ovo"</p>`);
}
function fimDePartida() {
  rodando = false; $("botoes").classList.add("hidden"); $("missao").classList.add("hidden");
  const rank = [...bases].sort((a, b) => b.moedas - a.moedas);
  const pos = rank.indexOf(bases[0]) + 1;
  let recorde = 0; try { recorde = +localStorage.getItem("roube-ovo-recorde") || 0; } catch (e) {}
  const pontos = Math.floor(bases[0].moedas), novo = pontos > recorde;
  if (novo && !DEMO) try { localStorage.setItem("roube-ovo-recorde", pontos); } catch (e) {}
  salvaProgresso();
  if (DEMO) { setTimeout(novaPartida, 6000); }
  const de = nivelCfg(nivel).xp, ate = nivelCfg(nivel + 1).xp;
  tela(`<h1>${pos === 1 ? "🏆 Você venceu!" : `Você ficou em ${pos}º`}</h1>
    <table>${rank.map((b, i) => `<tr><td>${i + 1}º</td><td style="color:${b.cor}">${b.nome}</td><td>🪙 ${Math.floor(b.moedas)}</td></tr>`).join("")}</table>
    <p>🎯 ${missoesCumpridas} missões cumpridas · +${xpPartida} XP<br>
    <span class="nv">⭐ Nível ${nivel} · ${progresso.xp - de}/${ate - de} XP para o próximo</span></p>
    <p>${novo ? "⭐ Novo recorde seu!" : `Seu recorde: 🪙 ${recorde}`}</p>
    <div class="linha"><button class="btn" onclick="novaPartida()">↻ Jogar de novo</button>
    <button class="btn sec" onclick="telaCriar()">🛠️ Criar a minha versão</button></div>`);
}
function telaCriar() {
  rodando = false; $("missao").classList.add("hidden"); $("botoes").classList.add("hidden");
  tela(`<h1>🛠️ Crie a sua versão</h1>
    <p><b>1.</b> Baixe este jogo (é um arquivo só).<br>
    <b>2.</b> Abra o arquivo num editor de texto e mude o <b>CONFIG</b> no topo: nomes, cores, velocidade, raridades, <b>missões</b>, <b>níveis</b> e <b>cenários</b>.<br>
    <b>3.</b> Quer mais? Cole o arquivo numa IA (ChatGPT, Gemini, Claude) e peça, por exemplo:</p>
    <pre>Neste jogo, crie uma missão nova "Proteja 3 pets
lendários por 20 segundos" e um nível 9 com o
cenário "vulcão" (chão vermelho e lava).
Explique o que você mudou.</pre>
    <div class="linha"><button class="btn" onclick="baixar()">⬇ Baixar o jogo</button>
    <button class="btn sec" onclick="telaInicio()">Voltar</button></div>
    <p style="font-size:13px">Aprenda a criar jogos com IA, de graça, no <b>INEMA.CLUB</b>.</p>`);
}
function baixar() {
  const blob = new Blob([FONTE_HTML], { type: "text/html" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "meu-roube-o-ovo.html"; a.click();
}

// janela para o teste automático (testa.cjs) espiar o estado do jogo
window.jogo = {
  estado: () => ({ rodando, nivel, xp: progresso.xp, moedas: bases ? bases[0].moedas : 0, missoesCumpridas,
                   missao: missao && textoMissao(missao.def), jogador: jogador && { x: jogador.x, y: jogador.y },
                   trancada: bases ? bases[0].trancadaAte > decorrido() : false, pedestais: bases ? bases[0].pedestais.length : 0,
                   cenario: cenarioAtual().nome, velRobo: rodando ? fatorRobo() : null }),
};

atualizaNivelHud();
if (DEMO) novaPartida(); else telaInicio();
requestAnimationFrame(laco);
</script>
