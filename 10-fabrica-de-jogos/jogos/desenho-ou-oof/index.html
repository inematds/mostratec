<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Desenho ou Oof! — Fábrica de Jogos INEMA</title>
<style>
  :root { --amarelo:#FACC15; --preto:#0c0c10; --tinta:#15121f; --papel:#fffaf0; --fundo:#241b47;
          --verde:#22c55e; --vermelho:#ef4444; --texto:#f5f5f5 }
  /* a página rola (para mostrar o painel INEMA.CLUB embaixo), mas o jogo fica fixo atrás */
  html { overflow-x:hidden; overflow-y:auto; overscroll-behavior:none }
  html,body { margin:0; background:var(--preto); color:var(--texto); touch-action:pan-y;
              user-select:none; -webkit-user-select:none; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif }
  input { user-select:text; -webkit-user-select:text }
  button { font-family:inherit }

  /* o jogo ocupa a tela toda, menos os 46 px da faixa amarela embaixo */
  #jogo { position:fixed; left:0; right:0; top:0; bottom:46px; display:flex; flex-direction:column; overflow:hidden;
          background:radial-gradient(circle at 18% 12%, #3d2f80 0, transparent 42%),
                     radial-gradient(circle at 88% 85%, #1d5470 0, transparent 46%), var(--fundo) }
  #jogo::before { content:""; position:absolute; inset:0; pointer-events:none;
                  background-image:radial-gradient(#ffffff12 2px, transparent 2.6px); background-size:26px 26px }

  /* ---------- HUD: moedas, nível e missão (sempre à vista) ---------- */
  #hud { position:relative; z-index:2; display:flex; gap:6px; padding:8px 8px 4px; align-items:stretch }
  .pilula { background:var(--papel); color:var(--tinta); border:3px solid var(--tinta); border-radius:14px;
            box-shadow:0 3px 0 var(--tinta); padding:3px 9px; font-weight:800; box-sizing:border-box }
  #h-moedas { font-size:19px; display:flex; align-items:center; white-space:nowrap }
  #h-nivel { min-width:92px; font-size:13px; display:flex; flex-direction:column; justify-content:center }
  #h-missao { flex:1; min-width:0; font-size:13px; display:flex; flex-direction:column; justify-content:center }
  #h-missao .topo { display:flex; justify-content:space-between; align-items:flex-start; gap:6px }
  #m-txt { overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; line-height:1.15; font-size:12.5px }
  #m-cont { color:#6b6280; white-space:nowrap }
  .barra { height:8px; background:#0001; border:2px solid var(--tinta); border-radius:6px; overflow:hidden; margin-top:3px }
  .barra > div { height:100%; width:0; background:var(--amarelo); transition:width .3s }
  #m-barra { background:var(--verde) }
  #h-missao.festa { animation:popm .9s ease-out }
  @keyframes popm { 0%{transform:scale(1)} 25%{transform:scale(1.06); background:var(--amarelo)} 100%{transform:scale(1)} }

  /* ---------- palco: só uma tela aparece por vez ---------- */
  #palco { position:relative; flex:1; min-height:0; z-index:1 }
  .tela { position:absolute; inset:0; display:none; box-sizing:border-box }
  .tela.ativa { display:flex }
  .rolavel { overflow:auto; overscroll-behavior:contain }

  /* botões cartoon: contorno escuro e sombra embaixo */
  .btn { background:var(--amarelo); color:#1a1206; border:3px solid var(--tinta); border-radius:14px; font-weight:900;
         padding:11px 16px; font-size:clamp(15px,2.2vw,18px); cursor:pointer; box-shadow:0 4px 0 var(--tinta); min-height:48px }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 var(--tinta) }
  .btn:disabled { background:#8b8698; color:#e5e5e5; cursor:default }
  .btn.sec { background:var(--papel); color:var(--tinta) }
  .btn.verde { background:var(--verde); color:#fff; text-shadow:0 2px 0 #0006 }
  .btn.grande { font-size:clamp(19px,3vw,24px); padding:13px 22px }

  /* caixa de papel no meio da tela (início, mensagens, final) */
  .centro { align-items:center; justify-content:center; padding:10px }
  .caixa { background:var(--papel); color:var(--tinta); border:4px solid var(--tinta); border-radius:20px; box-shadow:0 6px 0 var(--tinta);
           width:min(560px,100%); max-height:100%; box-sizing:border-box; padding:16px 16px 18px; text-align:center }
  .caixa h2 { margin:.1em 0 .3em; font-size:clamp(24px,6vw,36px); line-height:1.1 }
  .caixa p { line-height:1.45; margin:.5em 0; font-size:16px }
  .caixa .linha { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:12px }
  .nome-grande { font-size:clamp(30px,9vw,52px); font-weight:900; color:var(--tinta); background:var(--amarelo);
                 display:inline-block; padding:4px 18px; border-radius:14px; border:3px solid var(--tinta); margin:6px 0 }
  .tema-cx { background:#fef3c7; border:3px dashed var(--tinta); border-radius:14px; padding:8px 10px; font-size:clamp(19px,5vw,26px); font-weight:900; margin:8px 0 }
  .tema-cx small { display:block; font-size:12px; letter-spacing:.08em; color:#6b6280 }
  .rodape-cx { font-size:12px; color:#6b6280; margin-top:12px }
  pre { text-align:left; background:#15121f; color:#fde68a; padding:10px; border-radius:10px; overflow:auto; font-size:13px; white-space:pre-wrap; user-select:text }

  /* título do jogo */
  .logo { font-weight:900; font-size:clamp(40px,12vw,68px); line-height:.95; margin:4px 0 8px; letter-spacing:-.02em }
  .logo span { -webkit-text-stroke:3px var(--tinta); paint-order:stroke fill; text-shadow:0 5px 0 var(--tinta); display:inline-block }
  .logo .a { color:var(--amarelo); transform:rotate(-3deg) } .logo .b { color:#fff; font-size:.6em }
  .logo .c { color:var(--vermelho); transform:rotate(4deg) }
  .polaroids { display:flex; justify-content:center; gap:8px; margin:6px 0 4px }
  .polaroids img { width:min(26vw,120px); border:3px solid var(--tinta); border-radius:8px; background:#fff; box-shadow:0 3px 0 var(--tinta) }
  .polaroids img:nth-child(1) { transform:rotate(-6deg) } .polaroids img:nth-child(3) { transform:rotate(5deg) }
  .botoes-inicio { display:flex; flex-direction:column; gap:10px; margin-top:12px }
  .nv { display:inline-block; background:#ede9fe; border:2px solid var(--tinta); border-radius:999px; padding:4px 12px; font-weight:800; font-size:14px }

  /* ---------- tela de desenho ---------- */
  #t-desenho { flex-direction:column; padding:4px 8px 8px; gap:6px }
  #d-topo { display:flex; align-items:center; gap:8px }
  #d-tema { flex:1; min-width:0; background:var(--amarelo); color:var(--tinta); border:3px solid var(--tinta); border-radius:14px;
            box-shadow:0 3px 0 var(--tinta); padding:4px 10px; font-weight:900; font-size:clamp(17px,4.6vw,26px); line-height:1.15 }
  #d-tema small { display:block; font-size:12px; letter-spacing:.08em; font-weight:800; opacity:.7 }
  #d-tempo { flex:none; width:62px; height:62px; border-radius:50%; background:var(--papel); color:var(--tinta); border:3px solid var(--tinta);
             display:flex; align-items:center; justify-content:center; font-weight:900; font-size:24px; box-shadow:0 3px 0 var(--tinta) }
  #d-tempo.urgente { background:var(--vermelho); color:#fff; animation:pulsa .5s infinite alternate }
  @keyframes pulsa { to { transform:scale(1.12) } }
  #d-robos { display:flex; gap:8px; align-items:center; justify-content:center; font-size:13px; color:#e9e5ff; font-weight:700; min-height:28px; flex-wrap:wrap }
  .rb { position:relative; display:inline-flex }
  .rb img { width:28px; height:28px }
  .rb i { position:absolute; right:-8px; top:-6px; font-style:normal; font-size:14px; animation:rabisca .35s infinite alternate }
  @keyframes rabisca { from { transform:rotate(-20deg) translateX(-2px) } to { transform:rotate(15deg) translateX(2px) } }
  #d-corpo { flex:1; min-height:0; display:flex; flex-direction:column; gap:8px }
  #area-tela { flex:1; min-height:0; display:flex; align-items:center; justify-content:center }
  /* SÓ o quadro de desenho trava o gesto: o dedo desenha sem rolar a página */
  #cv { background:#fff; border:4px solid var(--tinta); border-radius:12px; box-shadow:0 5px 0 var(--tinta);
        touch-action:none; cursor:crosshair; display:block; width:300px; height:300px }
  #ferramentas { display:flex; flex-direction:column; gap:7px }
  .linha-f { display:flex; flex-wrap:wrap; gap:5px; justify-content:center }
  .cor { width:32px; height:32px; border-radius:50%; border:3px solid var(--tinta); cursor:pointer; padding:0; box-shadow:0 2px 0 var(--tinta) }
  .cor.sel { outline:3px solid #fff; outline-offset:2px; transform:scale(1.12) }
  .ferr { min-width:48px; height:48px; border-radius:12px; border:3px solid var(--tinta); background:var(--papel); color:var(--tinta);
          font-size:19px; font-weight:800; cursor:pointer; box-shadow:0 3px 0 var(--tinta); padding:0 5px; position:relative; line-height:1 }
  .ferr .rot { display:block; font-size:10px; margin-top:2px }
  .ferr.sel { background:var(--amarelo); transform:translateY(2px); box-shadow:0 1px 0 var(--tinta) }
  .ferr.trancado { background:#c9c4d6; color:#4b4560 }
  .ferr .cad { position:absolute; right:-4px; top:-6px; font-size:10px; background:var(--tinta); color:#fff; border-radius:6px; padding:1px 3px }
  .ferr .bola { display:inline-block; background:var(--tinta); border-radius:50% }
  #b-pronto { background:var(--verde); color:#fff; padding:0 12px; font-size:16px; text-shadow:0 2px 0 #0006 }
  @media (min-aspect-ratio: 5/4) {
    #d-corpo { flex-direction:row }
    #ferramentas { width:min(410px,38vw); justify-content:center; gap:12px }
    .cor { width:40px; height:40px } .ferr { min-width:58px; height:58px; font-size:23px } .ferr .rot { font-size:11px }
    #b-pronto { font-size:19px }
    #d-corpo { justify-content:center; gap:20px }
    #area-tela { flex:0 1 auto; height:100%; aspect-ratio:1/1; max-width:calc(100% - 430px) }
    #final-cx { width:min(760px,100%) }
  }

  /* ---------- galeria (votação e revelação) ---------- */
  #t-galeria { flex-direction:column; padding:4px 8px 8px; gap:6px }
  #g-titulo { text-align:center; font-weight:900; font-size:clamp(18px,4.8vw,28px); color:#fff; -webkit-text-stroke:1px var(--tinta);
              text-shadow:0 3px 0 var(--tinta); line-height:1.15 }
  #g-sub { text-align:center; font-size:14px; color:#e9e5ff; font-weight:700; min-height:18px }
  #g-grade { flex:1; min-height:0; display:grid; gap:8px; justify-content:center; align-content:center; overflow:auto; overscroll-behavior:contain; padding:4px }
  .carta { background:var(--papel); border:3px solid var(--tinta); border-radius:14px; box-shadow:0 4px 0 var(--tinta); padding:5px;
           color:var(--tinta); position:relative; display:flex; flex-direction:column; gap:4px; width:var(--img,140px); box-sizing:content-box; justify-self:center }
  .carta > img.des { width:100%; aspect-ratio:1/1; border-radius:8px; border:2px solid var(--tinta); display:block; background:#fff; box-sizing:border-box }
  .carta .nome { display:flex; align-items:center; gap:4px; font-weight:800; font-size:13px; white-space:nowrap; overflow:hidden; height:20px }
  .carta .nome img { width:20px; height:20px; flex:none }
  .carta .nome span { overflow:hidden; text-overflow:ellipsis }
  .votos { display:flex; gap:4px }
  .votos button { flex:1; height:44px; font-size:20px; border:3px solid var(--tinta); border-radius:10px; background:#fff; cursor:pointer; padding:0 }
  .votos .ve.sel { background:var(--amarelo) } .votos .vo.sel { background:var(--vermelho) }
  .votos button:disabled { opacity:.35; cursor:default }
  .carta.estrela { outline:4px solid var(--amarelo); outline-offset:2px } .carta.oof { outline:4px solid var(--vermelho); outline-offset:2px }
  .carta .eu { height:44px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:14px; background:#ede9fe; border-radius:10px }
  .placar { display:flex; justify-content:space-around; font-weight:900; font-size:19px; height:44px; align-items:center; background:#fff; border:2px solid var(--tinta); border-radius:10px }
  .placar span { white-space:nowrap; display:inline-flex; align-items:center; gap:3px }
  .placar b { display:inline-block; min-width:1.1em }
  .placar b.pop { animation:pop .35s }
  @keyframes pop { 40% { transform:scale(1.7) } }
  .carta.cai { animation:cai 1.6s cubic-bezier(.55,0,.9,.4) forwards; z-index:5 }
  @keyframes cai { 0%{transform:none} 18%{transform:translateY(-18px) rotate(-6deg)} 100%{transform:translateY(110vh) rotate(38deg); opacity:.4} }
  .carta.treme { animation:treme .12s 5 }
  @keyframes treme { 50% { transform:translateX(-5px) rotate(-2deg) } }
  .selo { position:absolute; left:50%; top:38%; transform:translate(-50%,-50%) rotate(-12deg); font-weight:900; white-space:nowrap;
          font-size:clamp(20px,4vw,34px); color:#fff; -webkit-text-stroke:2px var(--tinta); paint-order:stroke fill;
          background:var(--vermelho); border:3px solid var(--tinta); border-radius:12px; padding:2px 10px; pointer-events:none }
  .selo.fica { background:var(--verde); font-size:clamp(14px,2.6vw,20px); top:12%; transform:translate(-50%,-50%) rotate(-6deg) }
  .selo.escudo { background:#3b82f6 }
  #g-rodape { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; min-height:52px }

  /* ---------- final: pódio ---------- */
  .podio { display:flex; align-items:flex-end; justify-content:center; gap:8px; margin:6px 0 }
  .degrau { display:flex; flex-direction:column; align-items:center; width:min(30%,150px) }
  .degrau img.des { width:100%; aspect-ratio:1/1; border:3px solid var(--tinta); border-radius:10px; background:#fff }
  .degrau .bloco { width:100%; border:3px solid var(--tinta); border-radius:10px 10px 0 0; font-weight:900; font-size:22px; margin-top:4px; padding-top:4px }
  .degrau .nm { font-weight:800; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100% }
  .coroa { font-size:34px; line-height:1; animation:pulsa .6s infinite alternate }
  .ranking { margin:8px auto; border-collapse:collapse; font-size:15px }
  .ranking td { padding:1px 8px; text-align:left }
  .ranking tr.voce td { background:#fef3c7; font-weight:800 }

  /* ---------- amigos, meus desenhos ---------- */
  .campo { display:flex; gap:6px; margin:6px 0 }
  .campo input { flex:1; font-size:18px; padding:9px 10px; border:3px solid var(--tinta); border-radius:12px; min-width:0; font-weight:700 }
  .grade-meus { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:10px; margin:10px 0 }
  .grade-meus button { background:#fff; border:3px solid var(--tinta); border-radius:12px; padding:4px; cursor:pointer; font-size:12px; font-weight:700; color:var(--tinta) }
  .grade-meus img { width:100%; aspect-ratio:1/1; display:block; border-radius:8px }

  /* aviso rápido, faixa de comemoração e confete */
  #aviso { position:fixed; left:50%; bottom:64px; transform:translateX(-50%); background:#000d; padding:8px 14px; border-radius:10px; z-index:3;
           font-weight:700; pointer-events:none; opacity:0; transition:opacity .3s; max-width:calc(100% - 40px); text-align:center; font-size:15px }
  #festa { position:fixed; left:50%; top:40%; transform:translate(-50%,-50%); text-align:center; pointer-events:none; opacity:0; z-index:3; width:92% }
  #festa .g { font-size:clamp(32px,8vw,66px); font-weight:900; color:var(--amarelo); -webkit-text-stroke:2px var(--tinta); paint-order:stroke fill; text-shadow:0 5px 0 var(--tinta) }
  #festa .p { font-size:clamp(16px,2.8vw,22px); font-weight:800; color:#fff; text-shadow:0 2px 4px #000; margin-top:6px }
  #festa.mostra { animation:festa 2.6s ease-out }
  @keyframes festa { 0%{opacity:0; transform:translate(-50%,-50%) scale(.4)} 12%{opacity:1; transform:translate(-50%,-50%) scale(1.1)}
                     20%{transform:translate(-50%,-50%) scale(1)} 80%{opacity:1} 100%{opacity:0; transform:translate(-50%,-60%) scale(1)} }
  #confete { position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; z-index:3 }
  .hidden { display:none !important }

  /* ---------- painel INEMA.CLUB embaixo do jogo (deslize a tela para cima) ---------- */
  #rolagem { position:relative; z-index:4; pointer-events:none }
  #espaco { height:calc(100vh - 46px); height:calc(100dvh - 46px) }
  #painel { pointer-events:auto; background:var(--preto); touch-action:pan-y; text-align:center; padding-bottom:28px }
  #puxador { display:block; width:100%; height:46px; border:0; background:var(--amarelo); color:#1a1206; cursor:pointer;
             font:800 clamp(14px,3.8vw,18px)/46px Sora,system-ui,sans-serif; box-shadow:0 -4px 14px #0008 }
  #painel .faixa-g { background:var(--amarelo); color:#1a1206; font:800 clamp(24px,7vw,44px)/1.15 Sora,system-ui,sans-serif;
                     padding:22px 16px 26px; border-top:4px solid var(--preto) }
  #painel .faixa-g b { display:inline-block; background:var(--preto); color:var(--amarelo); padding:2px 14px; border-radius:10px; margin-top:8px }
  #painel .qr-g { display:inline-block; background:#fff; color:#111; border-radius:16px; padding:14px 14px 10px; margin:22px 16px 10px }
  #painel .qr-g svg { width:min(64vw,260px); height:auto; display:block }
  #painel .qr-g p { margin:8px 0 0; font-weight:800 }
  #painel .acoes-p { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:12px 16px }
  #painel .txt-p { color:#d4d4d8; max-width:520px; margin:10px auto 0; padding:0 16px; line-height:1.5 }
  #painel a { color:var(--amarelo) }
</style>
</head>
<body>
<div id="jogo">
  <div id="hud">
    <div id="h-moedas" class="pilula">🪙 <span id="h-moedas-n">0</span></div>
    <div id="h-nivel" class="pilula"><span id="nv-txt">⭐ Nível 1</span><div class="barra"><div id="xp-barra"></div></div></div>
    <div id="h-missao" class="pilula"><div class="topo"><span id="m-txt">🎯 …</span><span id="m-cont"></span></div><div class="barra"><div id="m-barra"></div></div></div>
  </div>
  <div id="palco">
    <!-- tela inicial -->
    <div id="t-inicio" class="tela centro"><div class="caixa rolavel" id="inicio-cx"></div></div>
    <!-- mensagens: rodada nova, "passe o celular", você caiu -->
    <div id="t-msg" class="tela centro"><div class="caixa rolavel" id="msg-cx"></div></div>
    <!-- desenho -->
    <div id="t-desenho" class="tela">
      <div id="d-topo"><div id="d-tema"></div><div id="d-tempo">45</div></div>
      <div id="d-robos"></div>
      <div id="d-corpo">
        <div id="area-tela"><canvas id="cv" width="512" height="512"></canvas></div>
        <div id="ferramentas">
          <div class="linha-f" id="f-cores"></div>
          <div class="linha-f" id="f-ferr"></div>
          <div class="linha-f" id="f-acoes"></div>
        </div>
      </div>
    </div>
    <!-- galeria: votação e revelação dos votos -->
    <div id="t-galeria" class="tela">
      <div id="g-titulo"></div><div id="g-sub"></div>
      <div id="g-grade"></div>
      <div id="g-rodape"></div>
    </div>
    <!-- amigos, meus desenhos, final, criar -->
    <div id="t-amigos" class="tela centro"><div class="caixa rolavel" id="amigos-cx"></div></div>
    <div id="t-meus" class="tela centro"><div class="caixa rolavel" id="meus-cx"></div></div>
    <div id="t-final" class="tela centro"><div class="caixa rolavel" id="final-cx"></div></div>
    <div id="t-criar" class="tela centro"><div class="caixa rolavel" id="criar-cx"></div></div>
  </div>
</div>
<canvas id="confete"></canvas>
<div id="aviso"></div>
<div id="festa"><div class="g" id="festa-g"></div><div class="p" id="festa-p"></div></div>
<div id="rolagem">
  <div id="espaco"></div>
  <div id="painel">
    <button id="puxador">⬆ INEMA.CLUB · Jogue no seu celular</button>
    <div class="faixa-g">Aprenda a criar jogos com IA<br>de graça<br><b>INEMA.CLUB</b></div>
    <div class="qr-g"><div id="qr-painel"></div><p>📱 Jogue no seu celular</p></div>
    <div class="acoes-p">
      <button class="btn" id="p-baixar">⬇ Baixar o jogo</button>
      <button class="btn" id="p-voltar">⬆ Voltar ao jogo</button>
    </div>
    <p class="txt-p">Baixe o jogo, abra num editor de texto e mude o <b>CONFIG</b>. Depois peça para uma IA criar temas, pincéis, robôs e modos novos.
      Mais jogos na <a href="../../">Fábrica de Jogos INEMA</a> · cursos grátis em <a href="https://inema.club" target="_blank" rel="noopener">inema.club</a></p>
  </div>

// ---------- utilidades ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = lista => lista[Math.floor(Math.random() * lista.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const embaralha = l => { const c = l.slice(); for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; } return c; };
const semAcento = t => t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
let avisoTimer = 0;
function aviso(txt) { const a = $("aviso"); a.textContent = txt; a.style.opacity = 1; avisoTimer = 2.4; }
function festa(grande, pequeno) {

}

// ---------- som (bipes simples, feitos na hora) ----------
let audio = null;
function som(notas, tipo) {
  if (!CONFIG.som) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state !== "running") return;           // o navegador só libera som depois de um toque
    notas.forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain(), t0 = audio.currentTime + i * 0.09;
      o.type = tipo || "square"; o.frequency.value = f; g.gain.setValueAtTime(0.05, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
      o.connect(g); g.connect(audio.destination); o.start(t0); o.stop(t0 + 0.17);
    });
  } catch (e) {}
}
addEventListener("pointerdown", () => { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {} });

// ---------- progresso salvo no navegador: XP, moedas e missão ----------
let prog = { xp: 0, moedas: 0, idxMissao: 0 };
if (!DEMO) try { const p = JSON.parse(localStorage.getItem(CHAVE)); if (p && p.xp >= 0) prog = { ...prog, ...p }; } catch (e) {}
function salva() { if (!DEMO) try { localStorage.setItem(CHAVE, JSON.stringify(prog)); } catch (e) {} }

// XP total para chegar no nível n (1, 2, 3...)
function xpDoNivel(n) { const L = CONFIG.niveis; return n <= L.length ? L[n - 1] : L[L.length - 1] + (n - L.length) * CONFIG.xpPorNivelExtra; }
function nivelDoXp(xp) { let n = 1; while (xp >= xpDoNivel(n + 1)) n++; return n; }
let nivel = nivelDoXp(prog.xp);
const liberado = d => nivel >= d.nivel;

// ganha moedas e XP; se subir de nível, comemora e mostra o que liberou
function ganha(moedas, xp) {
  prog.moedas += moedas; prog.xp += xp;
  const novo = nivelDoXp(prog.xp);
  if (novo > nivel) {
    const libs = CONFIG.desbloqueios.filter(d => d.nivel > nivel && d.nivel <= novo).map(d => d.nome);
    nivel = novo;
    setTimeout(() => { festa(`⭐ Nível ${nivel}!`, libs.length ? "🔓 Liberou: " + libs.join(" · ") : "Continue assim!"); som([523, 659, 784, 1047]); }, 900);
    montaFerramentas();
  }
  salva(); atualizaHud();
}

// ---------- HUD ----------
let moedasMostradas = prog.moedas;
function atualizaHud() {
  const de = xpDoNivel(nivel), ate = xpDoNivel(nivel + 1);
  $("nv-txt").textContent = `⭐ Nível ${nivel}`;
  $("xp-barra").style.width = clamp((prog.xp - de) / (ate - de) * 100, 0, 100) + "%";
  if (missao) {
    const d = missao.def;
    $("m-txt").textContent = "🎯 " + d.texto.replace("{n}", d.n);
    $("m-cont").textContent = `${Math.min(missao.feito, d.n)}/${d.n}`;
    $("m-barra").style.width = clamp(missao.feito / d.n * 100, 0, 100) + "%";
  }
}

// ---------- missões rápidas ----------
const POR_DESENHO = ["cores", "balde", "tracos", "pintar"];   // estas contam só no desenho de agora
let missao = null, missoesFeitas = 0;
function novaMissao() {
  const def = CONFIG.missoes[prog.idxMissao % CONFIG.missoes.length];
  missao = { def, feito: 0 };
  atualizaHud();
}
// tipo = o que aconteceu; valor = quanto. "absoluto" = o valor já é o total (ex.: cores usadas no desenho)
function eventoMissao(tipo, valor, absoluto) {
  if (!missao || missao.def.tipo !== tipo) return;
  missao.feito = absoluto ? valor : missao.feito + valor;
  atualizaHud();
  if (missao.feito >= missao.def.n) {
    const d = missao.def;
    missao = null; missoesFeitas++; prog.idxMissao++;
    festa("🎯 Missão cumprida!", `+${d.moedas} 🪙  +${d.xp} XP`);
    som([660, 880, 1100]);
    const el = $("h-missao"); el.classList.remove("festa"); void el.offsetWidth; el.classList.add("festa");
    ganha(d.moedas, d.xp);
    novaMissao();
    // missão de desenho nova já conta o que está no quadro agora
    if (telaAtual === "desenho" && POR_DESENHO.includes(missao.def.tipo)) eventoDesenho();
  }
}

/* ---------- FERRAMENTAS DE DESENHO ---------- */
const cv = $("cv"), ctx = cv.getContext("2d", { willReadFrequently: true });
let fer = "pincel", corSel = TINTA, tamIdx = 1, carimboIdx = 0;
let tracando = false, ult = null, hueArco = 0;
let pilhaDesfazer = [];
// métricas do desenho de agora (servem para a nota e para as missões)
let M = { cores: new Set(), tracos: 0, baldes: 0, usado: 0 };
const CARIMBOS = ["estrela", "coracao", "carinha", "flor", "raio"];
const ICONE_CARIMBO = { estrela: "⭐", coracao: "❤️", carinha: "😊", flor: "🌼", raio: "⚡" };

function limpaQuadro() { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, S, S); }
function salvaDesfazer() {
  pilhaDesfazer.push(ctx.getImageData(0, 0, S, S));
  if (pilhaDesfazer.length > CONFIG.maxDesfazer) pilhaDesfazer.shift();
}
function desfazer() { const img = pilhaDesfazer.pop(); if (img) { ctx.putImageData(img, 0, 0); som([300]); } else aviso("Nada para desfazer"); }
function limpar() { salvaDesfazer(); limpaQuadro(); som([200, 150]); }
function registraCor() {
  if (fer === "borracha") return;
  M.cores.add(fer === "arcoiris" ? "arcoiris" : corSel);
}

// um pedacinho de traço, do ponto (x0,y0) até (x1,y1)
function segmento(x0, y0, x1, y1) {
  const t = CONFIG.tamanhos[tamIdx];
  ctx.lineCap = ctx.lineJoin = "round"; ctx.lineWidth = t;
  if (fer === "borracha") ctx.strokeStyle = "#ffffff";           // a borracha pinta de branco (o fundo)
  else if (fer === "arcoiris") { hueArco = (hueArco + Math.hypot(x1 - x0, y1 - y0) * 0.8 + 1) % 360; ctx.strokeStyle = `hsl(${hueArco} 90% 55%)`; }
  else ctx.strokeStyle = corSel;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  if (fer === "glitter") {                                         // brilhinhos espalhados em volta do traço
    const n = Math.max(1, Math.floor(Math.hypot(x1 - x0, y1 - y0) / 5));
    for (let k = 0; k < n; k++) {
      const f = Math.random(), x = x0 + (x1 - x0) * f + rnd(-t, t), y = y0 + (y1 - y0) * f + rnd(-t, t);
      ctx.fillStyle = pick(["#ffffff", "#fde68a", "#fef9c3", corSel]);
      brilho(ctx, x, y, rnd(1.5, 4));
    }
  }
}
function brilho(g, x, y, r) {                                       // estrelinha de 4 pontas
  g.beginPath(); g.moveTo(x, y - r * 2); g.lineTo(x + r * .5, y - r * .5); g.lineTo(x + r * 2, y); g.lineTo(x + r * .5, y + r * .5);
  g.lineTo(x, y + r * 2); g.lineTo(x - r * .5, y + r * .5); g.lineTo(x - r * 2, y); g.lineTo(x - r * .5, y - r * .5); g.closePath(); g.fill();
}
function inicioTraco(x, y) { salvaDesfazer(); tracando = true; ult = { x, y }; registraCor(); segmento(x, y, x + 0.1, y + 0.1); }
function moveTraco(x, y) { if (!tracando) return; segmento(ult.x, ult.y, x, y); ult = { x, y }; }
function fimTraco() { if (!tracando) return; tracando = false; M.tracos++; eventoDesenho(); }

// BALDE: pinta a área de cor parecida em volta do ponto (algoritmo "flood fill" por linhas)
function aplicaBalde(x, y) {
  x = Math.floor(x); y = Math.floor(y);
  if (x < 0 || y < 0 || x >= S || y >= S) return false;
  const img = ctx.getImageData(0, 0, S, S), d = img.data;
  const i0 = (y * S + x) * 4, r0 = d[i0], g0 = d[i0 + 1], b0 = d[i0 + 2];
  const [r1, g1, b1] = hexRgb(corSel);
  if (Math.abs(r0 - r1) + Math.abs(g0 - g1) + Math.abs(b0 - b1) < 12) return false;   // já é dessa cor
  pilhaDesfazer.push(new ImageData(new Uint8ClampedArray(d), S, S));
  if (pilhaDesfazer.length > CONFIG.maxDesfazer) pilhaDesfazer.shift();
  const tol = CONFIG.toleranciaBalde, vis = new Uint8Array(S * S);
  const parecido = (p, t) => { const k = p * 4; return Math.abs(d[k] - r0) <= t && Math.abs(d[k + 1] - g0) <= t && Math.abs(d[k + 2] - b0) <= t; };
  const pinta = p => { const k = p * 4; d[k] = r1; d[k + 1] = g1; d[k + 2] = b1; d[k + 3] = 255; vis[p] = 1; };
  const pilha = [x, y];
  while (pilha.length) {
    const py = pilha.pop(); let px = pilha.pop(), p = py * S + px;
    while (px >= 0 && !vis[p] && parecido(p, tol)) { px--; p--; }       // anda para a esquerda até a borda
    px++; p++;
    let cima = false, baixo = false;
    while (px < S && !vis[p] && parecido(p, tol)) {                    // pinta para a direita e anota as linhas de cima e de baixo
      pinta(p);
      if (py > 0) { const q = p - S; if (!vis[q] && parecido(q, tol)) { if (!cima) { pilha.push(px, py - 1); cima = true; } } else cima = false; }
      if (py < S - 1) { const q = p + S; if (!vis[q] && parecido(q, tol)) { if (!baixo) { pilha.push(px, py + 1); baixo = true; } } else baixo = false; }
      px++; p++;
    }
  }
  // engorda 1 pixel para não sobrar uma "aura" branca grudada no contorno
  const borda = [];
  for (let p = S; p < S * S - S; p++) if (!vis[p] && (vis[p - 1] || vis[p + 1] || vis[p - S] || vis[p + S]) && parecido(p, tol * 2.4)) borda.push(p);
  borda.forEach(pinta);
  ctx.putImageData(img, 0, 0);
  M.baldes++; registraCor(); eventoDesenho(); som([440, 330], "triangle");
  return true;
}

// CARIMBOS: desenhos prontos que você "carimba" com um toque
function carimbo(g, tipo, x, y, r, cor) {
  g.save(); g.translate(x, y); g.fillStyle = cor; g.strokeStyle = TINTA; g.lineWidth = Math.max(3, r / 8); g.lineJoin = "round";
  g.beginPath();
  if (tipo === "estrela") for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  else if (tipo === "coracao") { g.moveTo(0, r * .9); g.bezierCurveTo(-r * 1.4, -r * .1, -r * .6, -r * 1.1, 0, -r * .4); g.bezierCurveTo(r * .6, -r * 1.1, r * 1.4, -r * .1, 0, r * .9); }
  else if (tipo === "carinha") g.arc(0, 0, r, 0, Math.PI * 2);
  else if (tipo === "flor") for (let i = 0; i < 5; i++) { const a = i * Math.PI * 2 / 5; g.moveTo(Math.cos(a) * r * .55 + r * .42, Math.sin(a) * r * .55); g.arc(Math.cos(a) * r * .55, Math.sin(a) * r * .55, r * .42, 0, Math.PI * 2); }
  else { const pts = [[.2, -1], [-.5, .1], [0, .1], [-.2, 1], [.5, -.15], [0, -.15]]; pts.forEach(([a, b]) => g.lineTo(a * r, b * r)); }
  g.closePath(); g.fill(); g.stroke();

// escolhe quantas colunas cabem para as cartas ficarem do maior tamanho possível, sem rolar
function ajustaGrade() {
  const el = $("g-grade"), n = el.children.length; if (!n) return;
  const W = el.clientWidth - 8, H = el.clientHeight - 8, gap = 8, extra = 92;
  let melhor = 0, cols = 1;
  for (let c = 1; c <= n; c++) {
    const r = Math.ceil(n / c), s = Math.min((W - gap * (c - 1)) / c - 16, (H - gap * (r - 1)) / r - extra);
    if (s > melhor) { melhor = s; cols = c; }
  }
  melhor = Math.max(92, Math.min(260, Math.floor(melhor)));
  el.style.gridTemplateColumns = `repeat(${cols}, auto)`;
  el.style.setProperty("--img", melhor + "px");
}

// ---------- revelação dos votos e eliminação ----------
function revelar() {
  $("g-titulo").textContent = "🥁 Contando os votos…";
  $("g-sub").textContent = `Tema: ${J.R.tema}`;
  $("g-rodape").innerHTML = "";
  montaGrade("placar");
  mostra("galeria");
  const fila = embaralha(J.R.votos.flatMap(v => [["ne", v.estrela], ["no", v.oof]]).filter(x => x[1]));
  const cont = {};
  const passo = () => {
    if (telaAtual !== "galeria") return;
    const lote = revelaRapido ? fila.length : 1;
    for (let i = 0; i < lote && fila.length; i++) {
      const [cls, id] = fila.shift(), k = cls + id; cont[k] = (cont[k] || 0) + 1;
      const b = document.querySelector(`#g-grade .carta[data-id="${id}"] .${cls}`);
      if (b) { b.textContent = cont[k]; b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); }
      som([cls === "ne" ? 990 : 180], cls === "ne" ? "triangle" : "sawtooth");
    }
    if (fila.length) setTimeout(passo, (DEMO ? CONFIG.demo.revelacaoIntervalo : CONFIG.revelacaoIntervalo) * 1000);
    else setTimeout(decide, revelaRapido ? 50 : 700);
  };
  setTimeout(passo, revelaRapido ? 10 : 600);
}
function decide() {
  if (telaAtual !== "galeria") return;
  const at = ativos(), est = {}, oof = {};
  at.forEach(p => { est[p.id] = 0; oof[p.id] = 0; });
  J.R.votos.forEach(v => { if (v.estrela in est) est[v.estrela]++; if (v.oof && v.oof in oof) oof[v.oof]++; });
  const sorte = {}; at.forEach(p => sorte[p.id] = Math.random());
  // do pior para o melhor: menor saldo (⭐ − 💥), depois mais 💥, depois menos ⭐, depois sorte
  const ordem = at.slice().sort((a, b) => (est[a.id] - oof[a.id]) - (est[b.id] - oof[b.id]) || oof[b.id] - oof[a.id] || est[a.id] - est[b.id] || sorte[a.id] - sorte[b.id]);
  const caem = Math.min(at.length - 1, at.length >= CONFIG.caemDoisSe ? 2 : 1);
  const esc0 = CONFIG.escudoIniciante;
  const protegido = p => J.modo === "robos" && p.humano && J.nivelInicial <= esc0.ateNivel && J.rodada <= esc0.rodadas;
  const fora = [];
  let escudoUsado = false;
  for (const p of ordem) { if (fora.length >= caem) break; if (protegido(p)) { escudoUsado = true; continue; } fora.push(p); }
  if (escudoUsado && !fora.includes(voce()) && ordem.indexOf(voce()) >= caem) escudoUsado = false;   // só avisa se o escudo salvou mesmo
  // colocação de quem caiu: os que ficaram + posição dentro do grupo que caiu
  const ficam = at.length - fora.length;
  fora.forEach((p, i) => { p.ativo = false; p.colocacao = ficam + fora.length - i; });
  J.pessoas.forEach(p => { if (est[p.id]) p.estrelas += est[p.id]; });
  rodadasConcluidas++;

  // prêmios e missões de quem joga neste celular
  const humanosNaRodada = at.filter(p => p.humano);
  const estHumanas = humanosNaRodada.reduce((s, p) => s + est[p.id], 0);
  if (estHumanas) { ganha(estHumanas * CONFIG.premios.estrela.moedas, estHumanas * CONFIG.premios.estrela.xp); eventoMissao("estrelas", estHumanas); }
  if (humanosNaRodada.some(p => p.ativo)) { ganha(CONFIG.premios.sobreviver.moedas, CONFIG.premios.sobreviver.xp); eventoMissao("sobreviver", 1); }

  // animação: as cartas que caem tremem e despencam; as outras ganham "Fica!"
  document.querySelectorAll("#g-grade .carta").forEach(c => {
    const p = J.pessoas.find(x => x.id === c.dataset.id);
    if (fora.includes(p)) { c.classList.add("treme"); setTimeout(() => { c.classList.remove("treme"); c.insertAdjacentHTML("beforeend", `<div class="selo">💥 OOF!</div>`); c.classList.add("cai"); }, 600); }
    else c.insertAdjacentHTML("beforeend", escudoUsado && p.id === "voce" ? `<div class="selo fica escudo">🛡️ Escudo!</div>` : `<div class="selo fica">✅ Fica!</div>`);
  });
  setTimeout(() => som([300, 220, 150, 90], "sawtooth"), 600);
  const nomes = fora.map(p => p.id === "voce" ? "Você" : p.nome);
  $("g-titulo").textContent = fora.length > 1 ? `💥 OOF! ${nomes.join(" e ")} caíram fora!` : `💥 OOF! ${nomes[0]} caiu fora!`;
  const robo = fora.find(p => !p.humano);
  $("g-sub").textContent = escudoUsado ? "🛡️ Escudo de iniciante: desta vez você ficou! Capriche na próxima."
    : robo ? `${robo.nome}: "${pick(CONFIG.frasesQueda)}"` : "Quem ficou segue para a próxima rodada!";
  const voceCaiu = J.modo === "robos" && fora.includes(voce());
  setTimeout(() => {
    let b;
    if (ativos().length <= 1) b = [["🏆 Ver o campeão", final]];
    else if (voceCaiu) b = [["Ver a minha colocação", telaCaiu]];
    else b = [["Próxima rodada ▶", iniciaRodada]];
    $("g-rodape").innerHTML = `<button class="btn grande" id="b-seguir">${b[0][0]}</button>`;
    $("b-seguir").onclick = b[0][1];
    autoDemo(b[0][1], CONFIG.demo.pausa * 1.6);
  }, revelaRapido ? 100 : 1500);
}
function telaCaiu() {
  const v = voce();
  msg(`<h2>💥 Você caiu fora!</h2><p>Você ficou em <b>${v.colocacao}º lugar</b> de ${J.pessoas.length}.<br>Ganhou ⭐ ${v.estrelas} estrela${v.estrelas === 1 ? "" : "s"} na partida.</p>

function andaDemo(dt) {
  if (esperaDemo > 0) { esperaDemo -= dt; return; }
  const a = planoDemo[passoDemo]; if (!a) return;
  corSel = a.cor;
  if (a.t === "balde") { fer = "balde"; aplicaBalde(a.x, a.y); passoDemo++; esperaDemo = 0.3; montaFerramentas(); return; }
  fer = "pincel"; tamIdx = a.tam;
  for (let k = 0; k < 3 && a.i < a.pts.length; k++, a.i++) { const [x, y] = a.pts[a.i]; a.i === 0 ? inicioTraco(x, y) : moveTraco(x, y); }
  if (a.i >= a.pts.length) { fimTraco(); passoDemo++; esperaDemo = 0.15; }
}

/* ---------- CONFETE ---------- */
const cf = $("confete"), cfx = cf.getContext("2d");
let confetes = [];
function soltaConfete() {
  cf.width = innerWidth; cf.height = innerHeight;
  confetes = Array.from({ length: 160 }, () => ({ x: rnd(0, cf.width), y: rnd(-cf.height, 0), vx: rnd(-40, 40), vy: rnd(120, 260), r: rnd(0, 6), vr: rnd(-6, 6),
    c: pick(["#facc15", "#ef4444", "#22c55e", "#3b82f6", "#ec4899", "#fff"]), w: rnd(6, 12) }));
}
function pararConfete() { confetes = []; cfx.clearRect(0, 0, cf.width, cf.height); }
function andaConfete(dt) {
  if (!confetes.length) return;
  cfx.clearRect(0, 0, cf.width, cf.height);
  confetes.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; if (p.y > cf.height + 20) { p.y = -20; p.x = rnd(0, cf.width); }
    cfx.save(); cfx.translate(p.x, p.y); cfx.rotate(p.r); cfx.fillStyle = p.c; cfx.fillRect(-p.w / 2, -3, p.w, 6); cfx.restore(); });
}

/* ---------- LAÇO PRINCIPAL ---------- */
let tAnt = performance.now();
function laco(t) {
  const dt = Math.min(0.1, (t - tAnt) / 1000); tAnt = t;
  if (telaAtual === "desenho" && J) {
    tempoRestante -= dt;
    const s = Math.max(0, Math.ceil(tempoRestante)), el = $("d-tempo");
    el.textContent = s;
    el.classList.toggle("urgente", s <= CONFIG.avisoFinal);
    if (s !== segAnterior) { segAnterior = s; if (s <= CONFIG.avisoFinal && s > 0) som([s <= 3 ? 990 : 660]); }
    if (DEMO) andaDemo(dt);
    tPintar += dt;
    if (tPintar > 0.5) { tPintar = 0; if (missao && missao.def.tipo === "pintar") eventoDesenho(); }
    if (tempoRestante <= 0) { som([200, 160]); terminaDesenho(); }
  }
  // moedas sobem contando
  if (moedasMostradas !== prog.moedas) {
    moedasMostradas += (prog.moedas - moedasMostradas) * Math.min(1, dt * 6);
    if (Math.abs(prog.moedas - moedasMostradas) < 0.5) moedasMostradas = prog.moedas;
    $("h-moedas-n").textContent = Math.round(moedasMostradas);
  }
  if (avisoTimer > 0) { avisoTimer -= dt; if (avisoTimer <= 0) $("aviso").style.opacity = 0; }
  andaConfete(dt);
  requestAnimationFrame(laco);
}

// janela para o teste automático (testa.cjs) espiar e acelerar o jogo
window.estadoDoJogo = () => ({
  tela: telaAtual, modo: J && J.modo, rodada: J ? J.rodada : 0, rodadasConcluidas,
  participantes: J ? J.pessoas.length : 0, ativos: J ? ativos().length : 0,
  eliminados: J ? J.pessoas.filter(p => !p.ativo).map(p => p.nome) : [], campeao: J && J.campeao ? J.campeao.nome : null,
  pixelsPintados: +pixelsPintados().toFixed(2), coresUsadas: M.cores.size, tracos: M.tracos, baldes: M.baldes, desfazer: pilhaDesfazer.length,
  segundosRestantes: +Math.max(0, tempoRestante).toFixed(1), moedas: prog.moedas, xp: prog.xp, nivel,
  missao: missao && missao.def.texto.replace("{n}", missao.def.n), missoesFeitas,
  eleitor: J && J.eleitor ? J.eleitor.nome : null, votos: J && J.R ? J.R.votos.length : 0,
});
window.teste = { acabaTempo() { tempoRestante = 0.01; }, pulaRevelacao(v = true) { revelaRapido = v; } };

limpaQuadro();
novaMissao();
montaFerramentas();
atualizaHud();
$("h-moedas-n").textContent = prog.moedas;
if (DEMO) novaPartida("robos"); else telaInicio();
requestAnimationFrame(laco);
</script>
