<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desenho Vivo · TV</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/static/pagina.css">
<style>
  [hidden]{display:none!important}
  html,body{height:100%;overflow:hidden}
  body{display:grid;grid-template-columns:1fr minmax(300px,28vw);grid-template-rows:1fr auto;gap:2vh 2vw;padding:3vh 2.5vw;background:var(--bg)}
  .palco{position:relative;background:#f6f1e3;border-radius:2vh;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;min-height:0}
  .ator{position:relative;z-index:1;height:92%;aspect-ratio:1;transition:opacity .4s}
  .ator img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
  .ator.andar{animation:atravessa 8s linear infinite}
  @keyframes atravessa{0%{transform:translateX(-60%)}50%{transform:translateX(60%)}50.01%{transform:translateX(60%) scaleX(-1)}100%{transform:translateX(-60%) scaleX(-1)}}
  .nome{position:absolute;z-index:2;left:3%;top:4%;font:800 clamp(24px,4.4vh,56px)/1.1 Sora,sans-serif;color:#1a1206}
  .acao{position:absolute;z-index:2;right:3%;top:4%;font:700 clamp(16px,2.6vh,30px) Sora,sans-serif;color:#7a5a12;text-transform:uppercase;letter-spacing:.12em}
  .vazio{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 clamp(28px,6vh,72px) Sora,sans-serif;color:#1a1206;text-align:center;padding:5%}
  aside{display:flex;flex-direction:column;justify-content:center;gap:2.4vh;min-height:0}
  aside h1{font-size:clamp(28px,5.4vh,64px);margin:0}
  aside p{font-size:clamp(16px,2.4vh,28px);color:var(--mut);margin:0}
  .qr{background:#fff;border-radius:2vh;padding:1.6vh;width:min(100%,38vh)}
  .qr img{display:block;width:100%;height:auto}
  .url{font:600 clamp(14px,2.2vh,26px) "JetBrains Mono",monospace;color:var(--amb);word-break:break-all}
  .fila{grid-column:1/-1;display:flex;gap:1.2vw;height:15vh;overflow:hidden}
  .fila figure{margin:0;height:100%;aspect-ratio:1;background:#f6f1e3;border-radius:1.2vh;flex:none;overflow:hidden}
  .fila img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
  .rodape{position:fixed;right:2.5vw;bottom:1vh;font-size:clamp(11px,1.5vh,16px);color:var(--mut)}
</style>
</head>
<body>
<section class="palco" id="palco">
  <div class="vazio" id="vazio" hidden>Seja o primeiro: desenhe, fotografe e veja aqui</div>
  <div class="nome" id="nome"></div><div class="acao" id="acao"></div>
  <div class="ator" id="ator" hidden><img id="gif" alt=""></div>
</section>
<aside>
  <span class="chip">MOSTRATEC 2026 · INEMA</span>
  <h1>Seu desenho <em>ganha vida</em></h1>
  <p>Desenhe um personagem no papel, aponte a câmera para o QR e mande a foto.</p>
  <div class="qr"><img src="/qr.png" alt="QR code para enviar o seu desenho"></div>
  <div class="url" id="url"></div>
  <p style="font-size:clamp(12px,1.7vh,18px)">Sem nome, sem e-mail. Os desenhos somem no fim do dia.</p>
</aside>
<div class="fila" id="fila"></div>
<div class="rodape">cursos abertos e gratuitos no INEMA.CLUB</div>
<script>
const NOMES = {andar: 'andando', pular: 'pulando', dancar: 'dançando'};
const $ = (x) => document.getElementById(x);
let itens = [], idx = 0, passo = 0, assinatura = null;
async function atualizar() {
  try {
    const j = await (await fetch('/api/tv', {cache: 'no-store'})).json();
    $('url').textContent = j.url.replace(/^https?:\/\//, '').replace(/\/$/, '');
    const nova = j.itens.map(i => i.id).join(',');
    if (nova !== assinatura) {
      const novos = j.itens.filter(i => !itens.some(v => v.id === i.id));
      itens = j.itens; assinatura = nova;
      if (novos.length) { idx = itens.findIndex(i => i.id === novos[0].id); passo = 0; mostrar(); }
      montarFila();
    }
  } catch (e) {}
}
function montarFila() {
  const f = $('fila'); f.replaceChildren();
  for (const i of itens.slice(0, 14)) {
    const fig = document.createElement('figure'); const img = document.createElement('img');
    img.src = i.gifs.dancar || i.gifs.andar || Object.values(i.gifs)[0]; img.alt = i.apelido || 'desenho';
    fig.append(img); f.append(fig);
  }
  if (!itens.length) { $('vazio').hidden = false; $('ator').hidden = true; $('nome').textContent = ''; $('acao').textContent = ''; }
}
function mostrar() {
  if (!itens.length) return;
  const it = itens[idx % itens.length];
  const movs = Object.keys(it.gifs);
  const mv = movs[passo % movs.length];
  $('vazio').hidden = true; $('ator').hidden = false;
  $('gif').src = it.gifs[mv]; $('gif').alt = (it.apelido || 'Desenho') + ' ' + (NOMES[mv] || mv);
  $('ator').className = 'ator ' + mv;
  $('nome').textContent = it.apelido || '';
  $('acao').textContent = NOMES[mv] || mv;
}
setInterval(() => {
  if (!itens.length) return;
  const movs = Object.keys(itens[idx % itens.length].gifs);
  passo++;
  if (passo >= movs.length) { passo = 0; idx = (idx + 1) % itens.length; }
  mostrar();
}, 5000);
atualizar(); setInterval(atualizar, 10000);
</script>
</body>
</html>
